<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendar">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Calendar</title>
<meta name="app-version" content="4.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1B2D; --ink-2:#3D4A5C; --ink-3:#6B7A8D; --ink-4:#9AA7B6;
  --panel:#EEF2F7; --surface:#FFFFFF; --surface-2:#F7FAFC;
  --line:#D5DEE8; --line-soft:#E8EEF4;
  --brand:#005596; --alert:#EE3124; --warn:#B45309; --ok:#059669;
  --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(15,27,45,.06), 0 4px 16px rgba(15,27,45,.06);
  --display:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); background:var(--panel);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px}
.hidden{display:none !important}

/* ---------- Sign in ---------- */
.mark{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  font-size:13px;color:var(--brand);margin:0 0 4px}
.card-signin h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:0 0 20px;letter-spacing:.01em}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.field input{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-2)
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;
  border:1px solid var(--line);background:var(--surface);transition:background .12s,border-color .12s
}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#004A84}
.btn-danger{color:var(--alert);border-color:#F3C9C5}
.btn-danger:hover{background:#FDF2F1}
.btn-block{width:100%}
.msg{font-size:13px;margin-top:12px;padding:9px 11px;border-radius:var(--radius-sm)}
.msg-err{background:#FDF2F1;color:#8E1B12;border:1px solid #F3C9C5}
.linky{display:block;width:100%;text-align:center;margin-top:10px;font-size:12.5px;
  font-weight:600;color:var(--ink-3);padding:4px}
.linky:hover{color:var(--brand);text-decoration:underline}
.connect-note{
  background:#FDF6EC;border:1px solid #F0DCC0;border-radius:var(--radius-sm);
  padding:10px 12px;font-size:12.5px;color:#7A4C09;margin-bottom:12px
}
.connect-note button{font-weight:700;color:var(--brand);text-decoration:underline}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.movebox{display:flex;gap:8px;align-items:center;margin-top:10px}
.movebox input{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-2);flex:1;min-width:0}

/* ---------- Shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
header.top{
  background:linear-gradient(100deg,#0F1B2D 0%,#17315A 52%,#1E3A6B 100%);
  color:#fff;position:sticky;top:0;z-index:40;
  padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap
}
header.top::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,
    #2563EB 0%,#2563EB 25%, #E11D48 25%,#E11D48 50%,
    #0D9488 50%,#0D9488 75%, #7C3AED 75%,#7C3AED 100%)
}
.top .brand{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;margin-right:2px}
.top .brand span{color:#7FB2DA;font-weight:500}
.nav-month{display:flex;align-items:center;gap:2px}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius-sm);
  color:#fff;opacity:.85
}
.icon-btn:hover{background:rgba(255,255,255,.12);opacity:1}
#periodLabel{
  font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;
  min-width:150px;text-align:center
}
.top .spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.10);border-radius:var(--radius-sm);padding:2px}
.seg button{padding:6px 12px;border-radius:4px;font-size:12.5px;font-weight:600;color:#C7D6E4}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.seg-light{background:var(--panel);width:100%}
.seg-light button{flex:1;color:var(--ink-3)}
.seg-light button[aria-pressed="true"]{background:var(--brand);color:#fff}
.sheet-b textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);resize:vertical}
.sheet-b select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
.top-btn{
  padding:7px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;
  border:1px solid rgba(255,255,255,.22);color:#fff
}
.top-btn:hover{background:rgba(255,255,255,.12)}
.top-btn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.verchip{font-size:11px;font-weight:700;letter-spacing:.04em;color:#9FC4E4;
  padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.18)}
.verchip:hover{background:rgba(255,255,255,.12);color:#fff}

main{flex:1;display:flex;align-items:flex-start;gap:16px;padding:16px;max-width:1500px;width:100%;margin:0 auto}

/* ---------- Sidebar ---------- */
aside{
  width:238px;flex:0 0 238px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:76px
}
.side-sec{padding:14px;border-bottom:1px solid var(--line-soft)}
.side-sec:last-child{border-bottom:0}
.side-h{
  font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  font-size:11.5px;color:var(--ink-3);margin:0
}
.side-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.side-head .side-h{flex:1}
.allnone{display:flex;align-items:baseline;gap:5px;font-size:11px;color:var(--ink-4)}
.allnone button{font-size:11px;font-weight:600;color:var(--ink-3)}
.allnone button:hover{color:var(--brand);text-decoration:underline}
.allnone button:disabled{color:var(--ink-4);opacity:.45;cursor:default;text-decoration:none}
.src{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer}
.src input{margin:0;accent-color:var(--brand);width:14px;height:14px;flex:0 0 auto}
.dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
/* Action vs FYI is carried by shape, not a third colour — the left border
   already means source and the fill already means category. A hollow ring
   reads as "tick me"; a solid marker reads as "just so you know". */
.dot.todo{background:transparent;border:2px solid;border-radius:50%;box-sizing:border-box}
.lrow.fyi .ltitle{font-weight:400;opacity:.82}
.chip.fyi{font-weight:400;border-left-style:dashed}
.src-body{min-width:0;flex:1}
.src-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-meta{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.src-meta.stale{color:var(--warn);font-weight:600}
.src-meta.bad{color:var(--alert);font-weight:600}
.cat{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px}
.cat input{margin:0;accent-color:var(--brand);width:14px;height:14px}
.cat .n{margin-left:auto;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}

/* ---------- Content ---------- */
.content{flex:1;min-width:0}
.running{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px
}
.running h2{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  font-size:11.5px;color:var(--ink-3);margin:0 0 10px}
.rrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rrow:last-child{margin-bottom:0}
.rlabel{width:190px;flex:0 0 190px;font-size:12.5px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rtrack{flex:1;height:9px;background:var(--line-soft);border-radius:5px;position:relative;min-width:60px}
.rbar{position:absolute;top:0;bottom:0;border-radius:5px;
  background-image:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0))}
#signin{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(145deg,#0F1B2D 0%,#19305A 45%,#3B2B6B 100%)}
.card-signin{
  width:100%;max-width:380px;background:var(--surface);border-radius:14px;
  padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.42);
  border-top:5px solid transparent;
  border-image:linear-gradient(90deg,#2563EB,#E11D48,#0D9488,#7C3AED) 1
}
.grid-head div:first-child,.grid-head div:last-child{color:#8B5CF6}

.grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px}
.grid-head div{
  font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  font-size:11px;color:var(--ink-3);text-align:center;padding:6px 0
}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  /* every row matches the tallest, so weeks are not different heights */
  grid-auto-rows:1fr}
.cell{background:var(--surface);min-height:132px;padding:5px 6px 7px;
  display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:var(--surface-2)}
.cell.wknd{background:#FBFCFE}
.cell.wknd.out{background:#F4F7FA}
.cell.today{background:#EDF5FF;box-shadow:inset 0 0 0 2px rgba(37,99,235,.30)}
.daynum{
  font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;line-height:1.1;margin-bottom:1px
}
.cell.out .daynum{color:var(--ink-4)}
.cell.today .daynum{
  color:#fff;background:linear-gradient(135deg,#2563EB,#7C3AED);
  width:22px;height:22px;display:grid;place-items:center;
  border-radius:6px;font-size:13px
}
.chip{
  width:100%;text-align:left;font-size:11.5px;line-height:1.28;font-weight:500;
  padding:3px 5px 3px 7px;border-radius:4px;background:var(--surface-2);
  border-left:3px solid var(--ink-4);
  /* wrap to two lines, then trail off, rather than cutting mid-word */
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  overflow:hidden;overflow-wrap:anywhere;
  transition:filter .12s
}
.chip:hover{filter:brightness(.94) saturate(1.15)}
.chip.done{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--ink-3);font-weight:600;padding:1px 5px;text-align:left}

/* ---------- List ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.lday{display:flex;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.lday:last-child{border-bottom:0}
.lday.is-today{background:#F0F7FD}
.ldate{width:56px;flex:0 0 56px;text-align:center}
/* ---------- Planner ---------- */
.psec{padding:10px 14px 4px;border-bottom:1px solid var(--line-soft)}
.psec:last-of-type{border-bottom:0}
.psec h3{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 7px;display:flex;
  align-items:center;gap:7px}
.psec h3 .pn{font-weight:600;color:var(--ink-4);letter-spacing:0;text-transform:none}
.psec.is-over h3{color:#B42318}
/* One line per task: tick · kind · what · when · pin. The kind column is a
   fixed width so the five kinds line up and can be read straight down. */
.prow{display:flex;align-items:center;gap:10px;padding:4px 2px}
.prow + .prow{border-top:1px solid var(--line-soft)}
.pkind{flex:0 0 58px;display:flex}
.pkind span{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 0;border-radius:3px;width:100%;text-align:center}
.pwhen{flex:0 0 auto;display:flex;align-items:center;gap:5px;margin-left:auto;
  font-size:11px;font-weight:600;color:var(--ink-4);white-space:nowrap}
.pwhen .prep{font-size:13px;cursor:help}
/* Which store, when the list is not already grouped by one */
.pstore{padding:1px 6px;border-radius:3px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--ink-3)}
/* How long this has been following you around */
.pcarry{color:#B45309;cursor:help;white-space:nowrap}
.prow.stale .ptitle{color:#9A3412}
/* A real tick, not a decoration — one tap marks it done */
.ptick{flex:0 0 auto;width:19px;height:19px;margin-top:1px;border-radius:50%;
  border:2px solid var(--ink-4);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .12s}
.ptick:hover{border-color:var(--brand);background:#EDF5FF}
.ptick svg{opacity:0;width:11px;height:11px}
.ptick:hover svg{opacity:.55}
/* Truncates rather than wrapping, so every row is the same height. The full
   text is in the tooltip and on the task itself. */
.ptitle{flex:1;min-width:0;font-size:13.5px;line-height:1.5;color:var(--ink-1);
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.one .ptitle{font-weight:600}
/* The pin sits on the right, out of the way of the tick, and only fills in
   once it is on — an outline everywhere would read as decoration. */
.ppin{flex:0 0 auto;width:26px;height:26px;padding:3px;border-radius:5px;
  background:transparent;color:var(--ink-4);cursor:pointer;opacity:.45;
  transition:opacity .12s,color .12s,background .12s}
.ppin svg{width:100%;height:100%;fill:none}
.ppin:hover{opacity:1;color:var(--brand);background:#EDF5FF}
.ppin.on{opacity:1;color:#B45309}
.ppin.on svg{fill:#F5B23733}
/* Stands where the tick does for rows from other apps, carrying that
   source's colour so the by-store list stays readable when mixed. */
.psrc{flex:0 0 auto;width:11px;height:11px;margin:0 4px;border-radius:50%}
.stores{display:flex;flex-wrap:wrap;gap:6px}
.storechip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;
  transition:all .12s}
.storechip:hover{border-color:var(--brand);color:var(--brand)}
.storechip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.prow.pin{background:#FFFBF2;border-radius:5px;margin:0 -4px;padding-left:6px;padding-right:6px}
.prow.pin .ptitle{font-weight:700}
.plater{padding:11px 14px;font-size:12px;color:var(--ink-4);border-top:1px solid var(--line-soft)}
/* Only shown in the All view, where a bare day number spans three years */
.ldate .lmon{font-family:var(--display);font-weight:600;font-size:10.5px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-4);margin-top:1px}
.ldate .dow{font-family:var(--display);font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;font-size:10.5px;color:var(--ink-3)}
.ldate .dnum{font-family:var(--display);font-weight:600;font-size:24px;line-height:1;
  font-variant-numeric:tabular-nums}
.levents{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.lrow{display:flex;align-items:center;gap:9px;text-align:left;padding:4px 8px;width:100%;
  transition:filter .12s}
.lrow:hover{filter:brightness(.95) saturate(1.15)}
.ltitle{font-size:13.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.done .ltitle{opacity:.5;text-decoration:line-through}
.tag{font-size:10.5px;font-weight:600;padding:1.5px 6px;border-radius:3px;
  background:var(--surface-2);color:var(--ink-3);white-space:nowrap;flex:0 0 auto;
  border:1px solid var(--line-soft)}
.lday.is-today{background:#EDF5FF}
.ldate .dnum{font-family:var(--display);font-weight:600;font-size:24px;line-height:1;
  font-variant-numeric:tabular-nums}
.lday.is-today .dnum{color:var(--brand)}

.empty{padding:52px 24px;text-align:center;color:var(--ink-3)}
.empty p{margin:0 0 4px;font-size:15px;font-weight:500;color:var(--ink-2)}
.empty small{font-size:13px}

/* ---------- Sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{
  background:var(--surface);border-radius:14px;width:100%;max-width:420px;
  box-shadow:0 28px 70px rgba(0,0,0,.32);max-height:88dvh;overflow:auto
}
.sheet-h{padding:16px 18px 12px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:flex-start;gap:12px}
.sheet-h h3{font-family:var(--display);font-weight:600;font-size:21px;margin:0;line-height:1.2;flex:1}
.sheet-b{padding:16px 18px}
.sheet-f{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:flex;gap:12px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:0}
.kv dt{width:88px;flex:0 0 88px;color:var(--ink-3);font-weight:500}
.kv dd{margin:0;flex:1;font-weight:500}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:#FDF6EC;color:var(--warn);border:1px solid #F0DCC0}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;
  background:var(--ink);color:#fff;padding:11px 15px;border-radius:var(--radius-sm);
  font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  max-width:calc(100vw - 32px)
}
.toast button{font-weight:600;color:#9FD0F5;font-size:13px;white-space:nowrap}

.side-toggle{display:none}
.scrim-side{display:none}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  main{padding:10px;gap:0}
  aside{
    position:fixed;top:0;left:0;bottom:0;width:266px;flex:none;z-index:70;
    border-radius:0;border-top:0;border-bottom:0;overflow:auto;
    transform:translateX(-100%);transition:transform .2s ease
  }
  body.side-open aside{transform:none}
  body.side-open .scrim-side{display:block;position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:65}
  .side-toggle{display:grid}
  #periodLabel{font-size:19px;min-width:118px}
  .top .brand{display:none}
  .cell{min-height:88px;padding:3px 3px 5px}
  .chip{font-size:10px;padding:2px 3px 2px 5px;border-left-width:2.5px;-webkit-line-clamp:2;line-clamp:2}
  .daynum{font-size:13px}
  .grid-head div{font-size:10px}
  .rlabel{width:110px;flex:0 0 110px;font-size:11.5px}
  .content{width:100%}
  /* Narrow screens have no room for a five-column row, so the kind column
     shrinks and the title is allowed two lines rather than being clipped
     to almost nothing. */
  .pkind{flex:0 0 42px}
  .pkind span{font-size:9px;letter-spacing:0}
  .ptitle{white-space:normal;overflow:visible;line-height:1.3;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
  .prow{align-items:flex-start;gap:8px}
  .pwhen{padding-top:2px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<!-- ============ SIGN IN ============ -->
<div id="signin">
  <div class="card-signin">

const dayFmt = new Intl.DateTimeFormat('en-CA', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',

const monthFmt = new Intl.DateTimeFormat('en-US', {

// For the All view, where a day number on its own could be any of three years

  timeZone: 'UTC', month: 'short', year: '2-digit',
});

function dayKey(iso) { return dayFmt.format(new Date(iso)); }
function keyOf(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function todayKey() { return dayFmt.format(new Date()); }
function addDaysKey(key, n) {
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}
function prettyDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Intl.DateTimeFormat('en-US', {
    timeZone: 'UTC', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
  }).format(new Date(Date.UTC(y, m - 1, d)));
}
function relTime(iso) {
  if (!iso) return 'never synced';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

}

/* ---------- Google sign-in, in a popup ----------
   Google refuses to run its sign-in inside a frame, so redirecting the page
   fails when the calendar is shown in a pane. A popup is a real top-level
   window, which Google accepts.

   The popup finishes the sign-in and hands the tokens straight back, rather
   than leaving them in storage for this page to find. In a frame the two
   windows do not necessarily share storage, so passing the tokens directly
   is the part that makes this work in a pane as well as on its own. */

const POPUP_MARKER = 'auth=popup';

function showSigninError(text) {
  const msg = $('signinMsg');
  msg.textContent = text;
  msg.classList.remove('hidden');
}

async function signInGoogle() {
  const btn = $('btnGoogle');
  const back = location.origin + location.pathname + '?' + POPUP_MARKER;

  // Opened before the await, or the browser treats it as an unrequested popup
  // and blocks it.
  const popup = window.open('about:blank', 'calendar-signin',
    'width=480,height=640,menubar=no,toolbar=no');

  if (!popup || popup.closed) {
    // Blocked, or we are not in a frame and it is not needed. Fall back.
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google', options: { redirectTo: location.origin + location.pathname },
    });
    if (error) showSigninError(error.message);
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Waiting for Google…';

  const finish = (ok, message) => {
    window.removeEventListener('message', onMessage);
    clearInterval(watch);
    btn.disabled = false;
    btn.textContent = 'Continue with Google';
    if (!ok && message) showSigninError(message);
  };

  async function onMessage(ev) {
    if (ev.origin !== location.origin) return;             // only our own popup
    if (!ev.data || ev.data.type !== 'calendar-auth') return;

    if (ev.data.error) { finish(false, ev.data.error); return; }

    const { error } = await sb.auth.setSession({
      access_token: ev.data.access_token,
      refresh_token: ev.data.refresh_token,
    });
    if (error) { finish(false, error.message); return; }

    finish(true);
    await start();
  }

  window.addEventListener('message', onMessage);

  // If the window is closed without finishing, put the button back.
  const watch = setInterval(() => {
    if (popup.closed) finish(false, null);
  }, 600);

  const { data, error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: back, skipBrowserRedirect: true },
  });

  if (error || !data?.url) {
    popup.close();
    finish(false, error?.message || 'Could not start the Google sign-in.');
    return;
  }
  popup.location.href = data.url;
}

// Running as the sign-in popup: hand the session back and get out of the way.
async function completeAuthPopup() {
  let payload;
  try {
    const { data, error } = await sb.auth.getSession();
    payload = (error || !data?.session)
      ? { type: 'calendar-auth', error: error?.message || 'Google did not return a session.' }
      : {
          type: 'calendar-auth',
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token,
        };
  } catch (err) {
    payload = { type: 'calendar-auth', error: String(err?.message || err) };
  }
  try { window.opener.postMessage(payload, location.origin); } catch { /* opener gone */ }
  window.close();
}

async function signOut() {
  await sb.auth.signOut();
    location.reload();
}

function taskIdOf(e) { return String(e.source_id).replace(/^task:/, ''); }

// Update the copy on screen straight away, then quietly re-pull just this
// one source so the stored copy agrees with the planner.
async function afterWrite(applyLocally, successMessage, undo, reload) {
  applyLocally();
  render();
  toast(successMessage, undo ? 'Undo' : null, undo);
  // Tasks live in this database, so there is nothing to wait for.
  if (reload) await refresh();
}

/* ---------- writing tasks ----------
   Tasks live in this calendar's own database. All of these run under your
   own sign-in, so row-level security decides what is allowed. Nothing here
   uses a service key. */

const TASK_CATEGORIES = ['do', 'call', 'email', 'go', 'home'];

// Keeps the id scheme the planner used, so tasks migrated from it and tasks
// made here are indistinguishable.
function newTaskId() {
  const rand = Math.random().toString(36).slice(2, 7);
  return `t_${Date.now()}_${rand}`;
}

async function createTask({ text, date, category, priority, note, location }) {
  const { error } = await sb.from('tasks').insert({
    id: newTaskId(),
    text,
    date,
    category: (category || 'do').toLowerCase(),
    completed: false,
    rolled_over: false,
    priority: Boolean(priority),
    note: note || null,
    location: location || null,
  });
  if (error) { toast('Could not add the task: ' + error.message); return false; }

  // Deliberately no refresh here: a fan-out across five stores would fire
  // five reloads and five toasts. The caller refreshes once, at the end.
  return true;
}

async function editTask(e, patch) {
  const { error } = await sb.from('tasks')
    .update(patch).eq('id', taskIdOf(e));
  if (error) { toast('Could not save the task: ' + error.message); return false; }

  await afterWrite(() => {
    if (patch.text) e.title = patch.text;
    if (patch.category) e.category = patch.category.charAt(0).toUpperCase() + patch.category.slice(1);
  }, 'Task saved.', null, true);
  return true;
}

async function deleteTask(e) {
  // Keep enough to put it back if the undo is used.
  const { data: before } = await sb.from('tasks')
    .select('*').eq('id', taskIdOf(e)).maybeSingle();

  const { error } = await sb.from('tasks').delete().eq('id', taskIdOf(e));
  if (error) { toast('Could not delete the task: ' + error.message); return false; }

  await afterWrite(() => {}, 'Task deleted.', async () => {
    if (!before) { toast('Sorry — nothing was kept to restore.'); return; }
    const { error: err2 } = await sb.from('tasks').insert(before);
    if (err2) { toast('Could not restore it: ' + err2.message); return; }
    await afterWrite(() => {}, 'Task restored.', null, true);
  }, true);
  return true;
}

// Moving a repeating task: this occurrence only, or this one and every later
// one. The second also updates the rule, so newly generated dates follow.
async function moveSeries(e, newDate) {
  const oldDate = e.startKey;
  const shift = Math.round(
    (Date.parse(newDate + 'T00:00:00Z') - Date.parse(oldDate + 'T00:00:00Z')) / 86400000);
  if (!shift) return false;

  // The feed only says whether a task repeats, not which rule it belongs to.
  // Look that up here rather than widening the contract for all eight sources.
  const { data: self, error: selfErr } = await sb.from('tasks')
    .select('recurrence_id').eq('id', taskIdOf(e)).maybeSingle();
  if (selfErr || !self?.recurrence_id) {
    toast('Could not find the repeat this belongs to.');
    return false;
  }
  const seriesId = self.recurrence_id;

  const { data: rows, error: readErr } = await sb.from('tasks')
    .select('id, date')
    .eq('recurrence_id', seriesId)
    .gte('date', oldDate);
  if (readErr) { toast('Could not read the series: ' + readErr.message); return false; }

  for (const row of rows || []) {
    const d = new Date(Date.parse(row.date + 'T00:00:00Z') + shift * 86400000)
      .toISOString().slice(0, 10);
    const { error } = await sb.from('tasks').update({ date: d }).eq('id', row.id);
    if (error) { toast('Stopped partway: ' + error.message); await refresh(); return false; }
  }

  // Keep the rule itself in step so future occurrences land on the new day.
  const nd = new Date(newDate + 'T00:00:00Z');
  const { data: rule } = await sb.from('recurrences')
    .select('id, type').eq('id', seriesId).maybeSingle();
  if (rule) {
    const patch = rule.type === 'weekly'
      ? { day_of_week: nd.getUTCDay() }
      : rule.type === 'monthly'
        ? { day_of_month: nd.getUTCDate() }
        : null;
    if (patch) await sb.from('recurrences').update(patch).eq('id', rule.id);
  }

  await afterWrite(() => {},
    `Moved ${(rows || []).length} occurrences, and the repeat now falls on this day.`,
    null, true);
  return true;
}

async function setTaskDone(e, done) {
  const { error } = await sb.from('tasks')
    .update({ completed: done }).eq('id', taskIdOf(e));
  if (error) { toast('Could not update the task: ' + error.message); return false; }

  await afterWrite(
    () => { e.status = done ? 'complete' : 'open'; },
    done ? 'Marked complete.' : 'Marked not complete.',
    async () => { await setTaskDone(e, !done); }
  );
  return true;
}

// Pinning a task is the "must do" mark. It writes the priority column that
// has been on the tasks table all along, and only ever changes this one row —
// pinning one occurrence of a repeat does not pin the whole series.
async function setTaskPinned(e, pinned) {
  const { error } = await sb.from('tasks')
    .update({ priority: pinned }).eq('id', taskIdOf(e));
  if (error) { toast('Could not pin the task: ' + error.message); return false; }

  await afterWrite(
    () => { e.priority = pinned; },
    pinned ? 'Pinned to the top.' : 'Unpinned.',
    async () => { await setTaskPinned(e, !pinned); }
  );
  return true;
}

async function moveTask(e, newDate) {
  const previous = e.startKey;
  // Moving a task yourself is a decision, not a slip — it stops counting as
  // carried forward and the clock starts again from the date you chose.
  const { error } = await sb.from('tasks')
    .update({ date: newDate, rolled_over: false, rolled_from: null })
    .eq('id', taskIdOf(e));
  if (error) { toast('Could not move the task: ' + error.message); return false; }

  await afterWrite(
    () => {
      e.rolled_from = null;
      e.startKey = newDate; e.endKey = newDate;
      e.starts_at = `${newDate}T12:00:00Z`;
      e.ends_at = `${newDate}T12:00:00Z`;
    },
    `Moved to ${prettyDate(newDate)}.`,
    async () => { await moveTask(e, previous); }
  );
  return true;
}

/* ---------- data ---------- */
async function loadAll() {
  // Two years back so long-stalled items — an unsubmitted rebate claim, say —
  // stay visible rather than falling off the end.
  const from = new Date(); from.setMonth(from.getMonth() - 24);
  const to = new Date(); to.setMonth(to.getMonth() + 15);

  // The server returns at most 1000 rows per request, so ask in pages until a
  // short page comes back. Without this the calendar silently loses everything
  // past the first 1000 — and because they are ordered oldest first, what goes
  // missing is the present and the future.
  const PAGE = 1000;
  const rows = [];
  for (let page = 0; ; page++) {
    const { data, error } = await sb.from('v_calendar').select('*')
      .gte('starts_at', from.toISOString())
      .lte('starts_at', to.toISOString())
      .order('starts_at', { ascending: true })
      .range(page * PAGE, page * PAGE + PAGE - 1);
    if (error) throw error;
    rows.push(...(data || []));
    if (!data || data.length < PAGE) break;
    if (page > 50) break;            // a stop, in case something goes wrong
  }

  const src = await sb.from('sources').select('*').order('sort_order', { ascending: true });
  if (src.error) throw src.error;

  state.events = rows.map(e => ({
    ...e,
    startKey: dayKey(e.starts_at),
    endKey: e.ends_at ? dayKey(e.ends_at) : dayKey(e.starts_at),
  }));
  state.sources = src.data || [];
}

/* ---------- filtering ---------- */
function visible() {
  return state.events.filter(e => {
    if (!state.showDone && e.status === 'complete') return false;
    if (state.hideSensitive && e.sensitivity !== 'normal') return false;
    if (state.offSources.has(e.source_app)) return false;
    if (e.category && state.offCats.has(e.category)) return false;
    return true;
  });
}
function spanDays(e) {
  const a = new Date(e.startKey + 'T00:00:00Z').getTime();
  const b = new Date(e.endKey + 'T00:00:00Z').getTime();
  return Math.round((b - a) / 86400000) + 1;
}
function colorFor(e) {
  return e.source_color || '#6B7A8D';
}

// Anything new gets a stable colour of its own. The palette above already
// occupies most of the wheel, so fall back only into the gaps it leaves —
// picking a hue at random would sit on top of an existing colour.
const FALLBACK_HUES = [58, 72, 112, 132, 305, 322];

function catStyle(cat) {
  if (!cat) return { fill: '#EEF2F7', ink: '#3D4A5C', line: '#9AA7B6' };
  if (CAT_COLORS[cat]) return CAT_COLORS[cat];
  let n = 0;
  for (let i = 0; i < cat.length; i++) n = (n * 31 + cat.charCodeAt(i)) >>> 0;
  const h = FALLBACK_HUES[n % FALLBACK_HUES.length];
  return {
    fill: `hsl(${h} 74% 90%)`,
    ink:  `hsl(${h} 68% 26%)`,
    line: `hsl(${h} 62% 48%)`,
  };
}

/* ---------- sidebar ---------- */

// Everything the sidebar is currently offering, so All and None act on
// exactly what you can see rather than on a remembered list.
function allSourceKeys() {
  const keys = new Set(state.sources.map(s => s.source_app));
  state.events.forEach(e => keys.add(e.source_app));
  return [...keys];
}
function allCategoryKeys() {
  const keys = new Set();
  state.events.forEach(e => {
    if (state.offSources.has(e.source_app)) return;
    if (!state.showDone && e.status === 'complete') return;
    if (state.hideSensitive && e.sensitivity !== 'normal') return;
    if (e.category) keys.add(e.category);
  });
  return [...keys];
}
function renderSidebar() {
  const wrap = $('srcList');
  wrap.innerHTML = '';

  // Two different numbers, and conflating them was a real trap: the sidebar
  // used to show everything a source had loaded (three years' worth), while
  // the views only ever draw the month you are looking at. Pricing could say
  // "4 events" with nothing on screen, because all four sat in other months.
  // So count what this month actually shows, and keep the total beside it.
  const y = state.cursor.getFullYear();
  const m = state.cursor.getMonth();
  const monthStart = keyOf(y, m, 1);
  const monthEnd = keyOf(y, m, new Date(y, m + 1, 0).getDate());

  const counts = {};   // showing in this month, after filters
  const totals = {};   // everything loaded for that source
  const nextUp = {};   // nearest one after this month, for the tooltip

  state.events.forEach(e => {
    totals[e.source_app] = (totals[e.source_app] || 0) + 1;

    // Every filter except the source's own tick box — otherwise unticking a
    // source would drop its count to zero and hide why you turned it off.
    if (!state.showDone && e.status === 'complete') return;
    if (state.hideSensitive && e.sensitivity !== 'normal') return;
    if (e.category && state.offCats.has(e.category)) return;

    // The All view has no month limit but drops FYI rows, so the count has
    // to follow the same rule or it will promise birthdays it will not draw.
    if (state.view === 'list' && state.listAll
          ? e.kind !== 'fyi'
          : (e.endKey >= monthStart && e.startKey <= monthEnd)) {
      counts[e.source_app] = (counts[e.source_app] || 0) + 1;
    } else if (e.startKey > monthEnd &&
               (!nextUp[e.source_app] || e.startKey < nextUp[e.source_app])) {
      nextUp[e.source_app] = e.startKey;
    }
  });

  // Anything that lives in this database — your own entries and your tasks —
  // is not a synced source, so build its row from the events themselves.
  const rows = [...state.sources];
  const registered = new Set(state.sources.map(s => s.source_app));
  const seen = new Map();
  state.events.forEach(e => {
    if (registered.has(e.source_app) || seen.has(e.source_app)) return;
    seen.set(e.source_app, {
      source_app: e.source_app,
      label: e.source_label || e.source_app,
      color: e.source_color || '#6B7A8D',
      last_success_at: null,
      local: true,
    });
  });
  rows.push(...seen.values());

  // Alphabetical, so a source is where you expect it rather than in whatever
  // order it happened to be added.
  // Defensive: one source row without a label should not take the whole
  // calendar down with it.
  rows.sort((a, b) => String(a.label || a.source_app || '')
    .localeCompare(String(b.label || b.source_app || ''), undefined, { sensitivity: 'base' }));

  rows.forEach(s => {
    const on = !state.offSources.has(s.source_app);
    const label = document.createElement('label');
    label.className = 'src';

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = on;
    cb.onchange = () => {
      if (cb.checked) state.offSources.delete(s.source_app);
      else state.offSources.add(s.source_app);
      savePrefs(); render();
    };

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = s.color;

    const body = document.createElement('span');
    body.className = 'src-body';
    const name = document.createElement('div');
    name.className = 'src-name';
    name.textContent = s.label;
    body.append(name);

    if (!s.local) {
      const meta = document.createElement('div');
      const age = s.last_success_at
        ? (Date.now() - new Date(s.last_success_at).getTime()) / 3600000
        : Infinity;
      meta.className = 'src-meta' + (age === Infinity ? ' bad' : age > 12 ? ' stale' : '');

      const shown = counts[s.source_app] || 0;
      const total = totals[s.source_app] || 0;
      meta.textContent = `${shown} of ${total} · ${relTime(s.last_success_at)}`;
      meta.title = (state.view === 'list' && state.listAll)
        ? `${shown} action items of ${total} dates loaded.`
        : shown === total
          ? `All ${total} of this source's dates fall in this month.`
          : `${shown} showing this month, ${total} in all.` +
            (nextUp[s.source_app] ? ` Next on ${prettyDate(nextUp[s.source_app])}.` : '');
      body.append(meta);
    }

    label.append(cb, dot, body);
    wrap.append(label);
  });

  // how many completed items the toggle is currently hiding
  const doneTotal = state.events.filter(e => e.status === 'complete').length;
  $('doneCount').textContent = doneTotal
    ? (state.showDone ? `${doneTotal} shown` : `${doneTotal} hidden`)
    : 'none yet';

  // categories
  const catWrap = $('catList');
  catWrap.innerHTML = '';
  const catCounts = {};
  state.events.forEach(e => {
    if (state.offSources.has(e.source_app)) return;
    if (!state.showDone && e.status === 'complete') return;
    if (state.hideSensitive && e.sensitivity !== 'normal') return;
    if (!e.category) return;
    catCounts[e.category] = (catCounts[e.category] || 0) + 1;
  });

  Object.keys(catCounts).sort().forEach(cat => {
    const on = !state.offCats.has(cat);
    const label = document.createElement('label');
    label.className = 'cat';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = on;
    cb.onchange = () => {
      if (cb.checked) state.offCats.delete(cat);
      else state.offCats.add(cat);
      savePrefs(); render();
    };
    const cs = catStyle(cat);
    const sw = document.createElement('span');
    sw.className = 'dot';
    sw.style.background = cs.line;
    const t = document.createElement('span');
    t.textContent = cat;
    t.style.color = on ? cs.ink : 'var(--ink-4)';
    t.style.fontWeight = '500';
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = catCounts[cat];
    label.append(cb, sw, t, n);
    catWrap.append(label);
  });

  const srcKeys = allSourceKeys();
  $('srcAll').disabled = state.offSources.size === 0;
  $('srcNone').disabled = srcKeys.every(k => state.offSources.has(k));
  const catKeys = Object.keys(catCounts);
  $('catAll').disabled = state.offCats.size === 0;
  $('catNone').disabled = catKeys.length > 0 && catKeys.every(c => state.offCats.has(c));

  if (!Object.keys(catCounts).length) {
    catWrap.innerHTML = '<div style="font-size:12.5px;color:var(--ink-4)">Nothing to filter yet.</div>';
  }
}

/* ---------- month view ---------- */
function renderMonth() {
  const y = state.cursor.getFullYear();
  const m = state.cursor.getMonth();
  const first = new Date(y, m, 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const monthStart = keyOf(y, m, 1);
  const monthEnd = keyOf(y, m, daysInMonth);

  const evs = visible();

  // multi-day events get their own band so they don't flood every day cell
  const spanning = evs.filter(e => spanDays(e) > 1 && e.endKey >= monthStart && e.startKey <= monthEnd);
  const single = evs.filter(e => spanDays(e) === 1);

  const runWrap = $('running');
  const runRows = $('runningRows');
  runRows.innerHTML = '';
  if (spanning.length) {
    runWrap.classList.remove('hidden');
    spanning.slice(0, 12).forEach(e => {
      const s = e.startKey < monthStart ? 1 : Number(e.startKey.slice(8, 10));
      const en = e.endKey > monthEnd ? daysInMonth : Number(e.endKey.slice(8, 10));
      const row = document.createElement('div');
      row.className = 'rrow';

      const lab = document.createElement('button');
      lab.className = 'rlabel';
      lab.textContent = e.title;
      lab.onclick = () => openEvent(e);

      const track = document.createElement('div');
      track.className = 'rtrack';
      const bar = document.createElement('div');
      bar.className = 'rbar';
      bar.style.backgroundColor = colorFor(e);
      bar.style.left = ((s - 1) / daysInMonth * 100) + '%';
      bar.style.width = ((en - s + 1) / daysInMonth * 100) + '%';
      bar.title = `${e.startKey} → ${e.endKey}`;
      track.append(bar);

      row.append(lab, track);
      runRows.append(row);
    });
  } else {
    runWrap.classList.add('hidden');
  }

  // bucket single-day events
  const byDay = {};
  single.forEach(e => { (byDay[e.startKey] ||= []).push(e); });

  const grid = $('grid');
  grid.innerHTML = '';
  const tk = todayKey();

  const prevMonthDays = new Date(y, m, 0).getDate();
  const totalCells = Math.ceil((startPad + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const dow = i % 7;
    if (dow === 0 || dow === 6) cell.classList.add('wknd');
    let key, label;

    if (i < startPad) {
      const d = prevMonthDays - startPad + i + 1;
      const pm = m === 0 ? 11 : m - 1;
      const py = m === 0 ? y - 1 : y;
      key = keyOf(py, pm, d); label = d;
      cell.classList.add('out');
    } else if (i >= startPad + daysInMonth) {
      const d = i - startPad - daysInMonth + 1;
      const nm = m === 11 ? 0 : m + 1;
      const ny = m === 11 ? y + 1 : y;
      key = keyOf(ny, nm, d); label = d;
      cell.classList.add('out');
    } else {
      const d = i - startPad + 1;
      key = keyOf(y, m, d); label = d;
    }
    if (key === tk) cell.classList.add('today');

    // Double-click empty space in a day to add something on that date.
    // Ignored when the double-click lands on an entry, so opening one still works.
    cell.title = 'Double-click to add on this day';
    cell.ondblclick = ev => {
      if (ev.target.closest('.chip, .more')) return;
      openAdd(key);
    };

    const num = document.createElement('div');
    num.className = 'daynum';
    num.textContent = label;
    cell.append(num);

    const items = (byDay[key] || []);
    const cap = window.innerWidth < 860 ? 2 : 3;
    items.slice(0, cap).forEach(e => {
      const cs = catStyle(e.category);
      const chip = document.createElement('button');
      chip.className = 'chip' + (e.status === 'complete' ? ' done' : '')
                              + (e.kind === 'fyi' ? ' fyi' : '');
      chip.style.background = cs.fill;
      chip.style.color = cs.ink;
      chip.style.borderLeftColor = colorFor(e);
      chip.textContent = e.title;            // star already in the title
      chip.title = `${e.priority ? 'Pinned — ' : ''}${e.title}`
                 + `${e.category ? ' — ' + e.category : ''}`;
      chip.onclick = () => openEvent(e);
      cell.append(chip);
    });
    if (items.length > cap) {
      const more = document.createElement('button');
      more.className = 'more';
      more.textContent = `+${items.length - cap} more`;
      more.onclick = () => openDay(key, items);
      cell.append(more);
    }
    grid.append(cell);
  }
}

/* ---------- list view ---------- */
function renderList(allDates = false) {
  const wrap = $('listWrap');
  wrap.innerHTML = '';
  const y = state.cursor.getFullYear();
  const m = state.cursor.getMonth();
  const monthStart = keyOf(y, m, 1);
  const monthEnd = keyOf(y, m, new Date(y, m + 1, 0).getDate());

  // The All view drops the month limit and shows everything loaded — two
  // years back and fifteen months forward. Measured at ~1,600 rows it builds
  // in about a tenth of a second, so it is drawn in one go rather than paged.
  //
  // See all means one thing only: ignore the month. It used to quietly drop
  // FYI rows as well, which made every training class disappear the moment
  // it was switched on — visible in the month grid, gone from the list, with
  // nothing on screen to explain it. Birthdays cluttering a long sweep are
  // what the Categories panel is for, and that choice is remembered.
  const evs = visible()
    .filter(e => allDates || (e.endKey >= monthStart && e.startKey <= monthEnd))
    .sort((a, b) => a.startKey.localeCompare(b.startKey)
      || (a.priority ? 0 : 1) - (b.priority ? 0 : 1)   // pinned first within a day
      || a.title.localeCompare(b.title));

  if (!evs.length) {
    wrap.innerHTML = allDates
      ? `<div class="empty"><p>Nothing outstanding.</p>
         <small>All shows action items only, across every month. Birthdays,
         campaigns and classes are left out.</small></div>`
      : `<div class="empty"><p>Nothing scheduled this month.</p>
         <small>Try a different month, or turn a filter back on.</small></div>`;
    return;
  }

  // In the month view a run that began earlier is pulled up to the 1st so it
  // still appears. With no month to clamp to, the All view keeps real dates.
  const byDay = {};
  evs.forEach(e => {
    const k = (!allDates && e.startKey < monthStart) ? monthStart : e.startKey;
    (byDay[k] ||= []).push(e);
  });

  const tk = todayKey();
  Object.keys(byDay).sort().forEach(key => {
    const row = document.createElement('div');
    row.className = 'lday' + (key === tk ? ' is-today' : '');
    row.title = 'Double-click to add on this day';
    row.ondblclick = ev => {
      if (ev.target.closest('.lrow')) return;
      openAdd(key);
    };

    const dateCol = document.createElement('div');
    dateCol.className = 'ldate';
    const [yy, mm, dd] = key.split('-').map(Number);
    const dt = new Date(Date.UTC(yy, mm - 1, dd));
    dateCol.innerHTML =
      `<div class="dow">${dowFmt.format(dt)}</div><div class="dnum">${dd}</div>` +
      (allDates ? `<div class="lmon">${monYrFmt.format(dt)}</div>` : '');

    const evCol = document.createElement('div');
    evCol.className = 'levents';
    byDay[key].forEach(e => {
      const cs = catStyle(e.category);
      const b = document.createElement('button');
      const isFyi = e.kind === 'fyi';
      b.className = 'lrow' + (e.status === 'complete' ? ' done' : '')
                           + (isFyi ? ' fyi' : '');
      b.style.borderLeft = `4px solid ${colorFor(e)}`;
      b.style.background = cs.fill;
      b.style.paddingLeft = '9px';
      b.style.borderRadius = '5px';
      const dot = document.createElement('span');
      dot.className = 'dot' + (isFyi ? '' : ' todo');
      if (isFyi) dot.style.background = cs.line;
      else dot.style.borderColor = cs.line;
      const t = document.createElement('span');
      t.className = 'ltitle';
      t.style.color = cs.ink;
      // The star arrives in the title from the database, so that the
      // deployed app shows it whether or not this build has landed. Do not
      // add a second one here.
      t.textContent = e.title;
      b.append(dot, t);
      if (e.category) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.style.background = '#ffffffcc';
        tag.style.color = cs.ink;
        tag.style.borderColor = cs.line + '66';
        tag.textContent = e.category;
        b.append(tag);
      }
      b.onclick = () => openEvent(e);
      evCol.append(b);
    });

    row.append(dateCol, evCol);
    wrap.append(row);
  });

  // Nearly four in five rows here are in the past, so landing at the top
  // would open three years ago. Start at today — or the next day that has
  // anything — and let the past be something you scroll up into.
  if (allDates) {
    const tkey = todayKey();
    const anchor = Object.keys(byDay).sort().find(k => k >= tkey);
    const target = anchor
      ? wrap.children[Object.keys(byDay).sort().indexOf(anchor)]
      : wrap.lastElementChild;
    if (target) target.scrollIntoView({ block: 'start' });
  }
}

/* ---------- Planner ----------
   Your own tasks only, nothing from the other sources. Relative to today
   rather than to the month being browsed, because a daily planner is about
   now: what slipped, what is due, what is coming.

   Within each section one-off tasks come before repeating chores. That is
   the whole point — a weekly errand should not sit above "Sit down with
   Anthony" just because its date is older. Nothing is hidden or merged;
   every occurrence is still its own line. */
/* One Planner line, shared by both groupings. `showSource` adds the app's
   colour dot, which only matters in the by-store view where rows arrive
   from several apps at once. Only this calendar's own tasks can be
   ticked or pinned; everything else opens read-only, as it does
   everywhere else in the app. */
function plannerRow(e, tk, showSource) {
      const row = document.createElement('div');
      // Carried for over a month is a different problem from carried since
      // Tuesday, so it reads differently.
      const carriedDays = e.rolled_from
        ? Math.round((Date.parse(tk) - Date.parse(String(e.rolled_from).slice(0, 10))) / 86400000)
        : 0;
      row.className = 'prow' + (e.is_series ? ' rep' : ' one')
                             + (e.priority ? ' pin' : '')
                             + (carriedDays >= 30 ? ' stale' : '');

      const mine = e.source_app === 'mustdo';

      // Rows from other apps are read-only here, so they get their source's
      // colour dot where the tick would be rather than a control that would
      // not work.
      const tick = document.createElement(mine ? 'button' : 'span');
      tick.className = mine ? 'ptick' : 'psrc';
      if (!mine) {
        tick.style.background = e.source_color || '#6B7A8D';
        tick.title = (e.source_label || 'Another app') + ' — open it there to tick it off';
        tick.setAttribute('aria-label', tick.title);
      }
      if (mine) {
      tick.setAttribute('aria-label', 'Mark "' + e.title + '" complete');
      tick.title = 'Mark complete';
      tick.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M20 6L9 17l-5-5"/></svg>';
      tick.onclick = async () => {
        if (tick.disabled) return;
        tick.disabled = true;                  // a second tap would double-write
        await setTaskDone(e, e.status !== 'complete');
      };
      }

      // Kind gets its own column so the five of them line up and can be
      // scanned down, and so each task fits on one line instead of two.
      const cat = document.createElement('div');
      cat.className = 'pkind';
      if (e.category) {
        const cs = catStyle(e.category);
        const chip = document.createElement('span');
        chip.style.background = cs.fill;
        chip.style.color = cs.ink;
        chip.textContent = e.category;
        cat.append(chip);
      }

      const t = document.createElement('button');
      t.className = 'ptitle';
      // The pin button beside it already says this is pinned, so drop the
      // star the title carries for older clients rather than show both.
      const clean = e.title.replace(/^★\s*/, '');
      t.textContent = clean;
      t.title = clean + (e.is_series && e.repeats ? ' — ' + e.repeats : '');
      t.onclick = () => openEvent(e);

      // Date and the repeat glyph share the right-hand column. The full
      // "Every Monday" wording lives in the tooltip and on the task itself,
      // which keeps the row to a single line.
      const when = document.createElement('div');
      when.className = 'pwhen';

      // The store, but not in the by-store view where the heading says it.
      // Without this, a sweep across five stores is five identical lines.
      if (!showSource && e.division) {
        const w = document.createElement('span');
        w.className = 'pstore';
        w.textContent = e.division;
        when.append(w);
      }

      // A task that keeps rolling forward otherwise looks due today.
      if (e.rolled_from) {
        const [yy, mm, dd] = String(e.rolled_from).slice(0, 10).split('-').map(Number);
        const days = Math.round(
          (Date.parse(tk) - Date.parse(String(e.rolled_from).slice(0, 10))) / 86400000);
        const c = document.createElement('span');
        c.className = 'pcarry';
        c.textContent = `↩ ${mm}/${dd}`;
        c.title = `Carried forward since ${mm}/${dd}/${yy}`
          + (days > 0 ? ` — ${days} day${days === 1 ? '' : 's'}` : '');
        when.append(c);
      }

      if (e.startKey !== tk) {
        const [, mm, dd] = e.startKey.split('-');
        const d = document.createElement('span');
        d.textContent = `${Number(mm)}/${Number(dd)}`;
        when.append(d);
      }
      if (e.is_series) {
        const r = document.createElement('span');
        r.className = 'prep';
        r.textContent = '↻';
        r.title = e.repeats || 'Repeats';
        when.append(r);
      }

      // Only this calendar's own tasks can be pinned; a spacer keeps the
      // columns lined up for the rest.
      if (!mine) {
        const spacer = document.createElement('span');
        spacer.style.cssText = 'flex:0 0 26px';
        row.append(tick, cat, t, when, spacer);
        return row;
      }

      const pin = document.createElement('button');
      pin.className = 'ppin' + (e.priority ? ' on' : '');
      pin.title = e.priority ? 'Unpin — stop keeping this at the top'
                             : 'Pin to the top of the day';
      pin.setAttribute('aria-pressed', String(Boolean(e.priority)));
      pin.setAttribute('aria-label',
        (e.priority ? 'Unpin ' : 'Pin ') + '"' + e.title + '"');
      pin.innerHTML = '<svg viewBox="0 0 24 24" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45-5.8-3.05-5.8 3.05 ' +
        '1.1-6.45-4.7-4.6 6.5-.95z"/></svg>';
      pin.onclick = async () => {
        if (pin.disabled) return;
        pin.disabled = true;
        await setTaskPinned(e, !e.priority);
      };

      row.append(tick, cat, t, when, pin);
      return row;
}

// The five retail locations, in the order Kathleen walks them. Labels match
// Brain Dump's exactly, so its store tasks land in the same group as the
// calendar's own rather than creating a second "Laguna Hills" heading.
const STORES = ['Anaheim', 'Santa Ana', 'Long Beach', 'Laguna', 'HUB'];

/* Everything open at each location, from every source that carries one —
   your own checks beside Brain Dump's store projects and Fleet's
   maintenance. FYI rows are left out, and the sidebar's source and category
   switches still apply, which is how you narrow a store walk down to real
   work: turn HR off once and it is remembered. */
function renderPlannerByStore(wrap) {
  const rows = visible().filter(e =>
    e.kind !== 'fyi' && e.division && String(e.division).trim());

  if (!rows.length) {
    wrap.innerHTML = `<div class="empty"><p>Nothing open at any location.</p>
      <small>Tasks only show here once they have a store on them.</small></div>`;
    return;
  }

  const byStore = new Map();
  rows.forEach(e => {
    const k = String(e.division).trim();
    if (!byStore.has(k)) byStore.set(k, []);
    byStore.get(k).push(e);
  });

  // Known stores in walking order, then anything else alphabetically.
  const order = [
    ...STORES.filter(s => byStore.has(s)),
    ...[...byStore.keys()].filter(s => !STORES.includes(s)).sort(),
  ];

  const tk = todayKey();
  order.forEach(store => {
    const list = byStore.get(store);
    list.sort((a, b) =>
      (a.priority ? 0 : 1) - (b.priority ? 0 : 1)
      || (a.startKey < tk ? 0 : 1) - (b.startKey < tk ? 0 : 1)   // overdue first
      || a.startKey.localeCompare(b.startKey)
      || a.title.localeCompare(b.title));

    const sec = document.createElement('div');
    sec.className = 'psec';
    const h = document.createElement('h3');
    h.textContent = store;
    const n = document.createElement('span');
    n.className = 'pn';
    const late = list.filter(e => e.startKey < tk).length;
    n.textContent = late ? `${list.length} · ${late} overdue` : String(list.length);
    h.append(n);
    sec.append(h);

    list.forEach(e => sec.append(plannerRow(e, tk, true)));
    wrap.append(sec);
  });
}

function renderPlanner() {
  const wrap = $('planWrap');
  wrap.innerHTML = '';
  if (state.planBy === 'store') return renderPlannerByStore(wrap);

  const tk = todayKey();
  const in7 = addDaysKey(tk, 7);

  const mine = state.events.filter(e => {
    if (e.source_app !== 'mustdo') return false;
    if (!state.showDone && e.status === 'complete') return false;
    if (state.hideSensitive && e.sensitivity !== 'normal') return false;
    if (e.category && state.offCats.has(e.category)) return false;
    return true;
  });

  if (state.offSources.has('mustdo')) {
    wrap.innerHTML = `<div class="empty"><p>My tasks is switched off.</p>
      <small>Turn it back on in the sidebar to use the Planner.</small></div>`;
    return;
  }

  // Today leads, not Overdue. The overdue pile is mostly repeating chores
  // stacking up, and opening on nine copies of a weekly errand buries the
  // very thing this view exists to surface. Overdue sits directly beneath,
  // with its count in the heading, so nothing is out of sight.
  const groups = [
    { key: 'today', title: 'Today',       rows: mine.filter(e => e.startKey === tk) },
    { key: 'over',  title: 'Overdue',     rows: mine.filter(e => e.startKey <  tk) },
    { key: 'week',  title: 'Next 7 days', rows: mine.filter(e => e.startKey >  tk && e.startKey <= in7) },
  ];
  const later = mine.filter(e => e.startKey > in7).length;

  if (!groups.some(g => g.rows.length)) {
    wrap.innerHTML = `<div class="empty"><p>Nothing due.</p>
      <small>${later ? `${later} task${later === 1 ? '' : 's'} further out.`
                     : 'Add one with the Add task button.'}</small></div>`;
    return;
  }

  groups.forEach(g => {
    if (!g.rows.length) return;

    // Pinned first, then one-offs before repeating chores, then date order.
    // A pinned chore deliberately outranks an unpinned one-off — that is what
    // pinning is for: "check the ice cream freezers" beats whatever is merely
    // on the list today.
    g.rows.sort((a, b) => {
      const ap = a.priority ? 0 : 1, bp = b.priority ? 0 : 1;
      const ar = a.is_series ? 1 : 0, br = b.is_series ? 1 : 0;
      return ap - bp
        || ar - br
        || a.startKey.localeCompare(b.startKey)
        || a.title.localeCompare(b.title);
    });

    const sec = document.createElement('div');
    sec.className = 'psec' + (g.key === 'over' ? ' is-over' : '');
    const h = document.createElement('h3');
    h.textContent = g.title;
    const n = document.createElement('span');
    n.className = 'pn';
    n.textContent = g.rows.length;
    h.append(n);
    sec.append(h);

    g.rows.forEach(e => sec.append(plannerRow(e, tk, false)));

    wrap.append(sec);
  });

  if (later) {
    const f = document.createElement('div');
    f.className = 'plater';
    f.textContent = `${later} more task${later === 1 ? '' : 's'} further out — `
      + 'see the List or All view.';
    wrap.append(f);
  }
}

/* ---------- modals ---------- */
function closeModal() { $('modalRoot').innerHTML = ''; }

function modal(inner) {
  const root = $('modalRoot');
  root.innerHTML = '';
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.onclick = e => { if (e.target === scrim) closeModal(); };
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.append(inner);
  scrim.append(sheet);
  root.append(scrim);
  document.onkeydown = e => { if (e.key === 'Escape') closeModal(); };
  return sheet;
}

function openDay(key, items) {
  const box = document.createElement('div');
  const h = document.createElement('div');
  h.className = 'sheet-h';
  h.innerHTML = `<h3>${esc(prettyDate(key))}</h3>`;
  const b = document.createElement('div');
  b.className = 'sheet-b';
  const col = document.createElement('div');
  col.className = 'levents';
  items.forEach(e => {
    const cs = catStyle(e.category);
    const btn = document.createElement('button');
    btn.className = 'lrow' + (e.status === 'complete' ? ' done' : '');
    btn.style.background = cs.fill;
    btn.style.borderLeft = `4px solid ${colorFor(e)}`;
    btn.style.borderRadius = '5px';
    const dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = cs.line;
    const t = document.createElement('span');
    t.className = 'ltitle'; t.style.color = cs.ink; t.textContent = e.title;
    btn.append(dot, t);
    if (e.repeats) {
      const rep = document.createElement('span');
      rep.className = 'tag';
      rep.style.color = cs.ink;
      rep.textContent = e.repeats;
      btn.append(rep);
    }
    btn.onclick = () => openEvent(e);
    col.append(btn);
  });
  b.append(col);
  const f = document.createElement('div');
  f.className = 'sheet-f';
  const close = document.createElement('button');
  close.className = 'btn'; close.textContent = 'Close';
  close.onclick = closeModal;
  f.append(close);
  box.append(h, b, f);
  modal(box);
}

function openEvent(e) {
  const box = document.createElement('div');

  const h = document.createElement('div');
  h.className = 'sheet-h';
  const cs = catStyle(e.category);
  const bar = document.createElement('div');
  bar.style.cssText = `width:5px;border-radius:3px;align-self:stretch;min-height:34px;` +
    `background:linear-gradient(180deg,${colorFor(e)},${cs.line})`;
  const ttl = document.createElement('h3');
  ttl.textContent = e.title;
  h.append(bar, ttl);

  const b = document.createElement('div');
  b.className = 'sheet-b';
  const dl = document.createElement('dl');
  dl.style.margin = '0';

  const range = e.startKey === e.endKey
    ? prettyDate(e.startKey)
    : `${prettyDate(e.startKey)} → ${prettyDate(e.endKey)}`;

  const rows = [
    ['When', range],
    // only for repeating tasks; everything else has no pattern to show
    ...(e.repeats ? [['Repeats', e.repeats]] : []),
    ['From', e.source_label || e.source_app],
    ['Category', e.category || '—'],
    ['Branch', e.division || '—'],
    ['Status', e.status || '—'],
  ];
  rows.forEach(([k, v]) => {
    const d = document.createElement('div');
    d.className = 'kv';
    d.innerHTML = `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`;
    dl.append(d);
  });
  if (e.sensitivity !== 'normal') {
    const d = document.createElement('div');
    d.className = 'kv';
    d.innerHTML = `<dt>Privacy</dt><dd><span class="pill">${
      e.sensitivity === 'private' ? 'Personal' : 'Sensitive'}</span></dd>`;
    dl.append(d);
  }
  b.append(dl);

  // Must-Do tasks are the one source you can change from here
  if (e.source_app === 'mustdo') {
    const box = document.createElement('div');

          if (!input.value || input.value === e.startKey) return;

          if (ok) closeModal(); else one.disabled = false;

        all.className = 'btn';

          if (!armedAll) { armedAll = true; all.textContent = 'Tap again — changes the repeat'; return; }

        go.onclick = async () => {
          if (!input.value || input.value === e.startKey) return;

function openAdd(presetDate) {
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="sheet-h"><h3>Add a task</h3></div>
    <div class="sheet-b">
      <div class="field">
        <label for="aTitle">What is it?</label>
        <input id="aTitle" type="text" placeholder="Call Stephen about pricing">
      </div>
      <div class="field">
        <label for="aStart">Date</label>
        <input id="aStart" type="date">
      </div>

      <div id="taskOnly">
        <div class="field">
          <label for="aKind">Kind</label>
          <select id="aKind">
            <option value="do">Do</option>
            <option value="call">Call</option>
            <option value="email">Email</option>
            <option value="go">Go</option>
            <option value="home">Home</option>
          </select>
        </div>
        <div class="field">
          <label for="aNote">Note (optional)</label>
          <textarea id="aNote" rows="2"></textarea>
        </div>
        <div class="field">
          <label>Store <span style="font-weight:400;color:var(--ink-4)">— pick more than one and you get a copy at each</span></label>
          <div class="stores" id="aStores"></div>
        </div>
        <label class="cat" style="margin-bottom:10px">
          <input type="checkbox" id="aPriority"><span>Priority</span>
        </label>
        <div class="field">
          <label for="aRepeat">Repeats</label>
          <select id="aRepeat">
            <option value="none">Does not repeat</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
          </select>
        </div>
        <div class="field hidden" id="weeklyWrap">
          <label for="aDow">On</label>
          <select id="aDow">
            <option value="0">Sunday</option><option value="1">Monday</option>
            <option value="2">Tuesday</option><option value="3">Wednesday</option>
            <option value="4">Thursday</option><option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
        </div>
        <div class="field hidden" id="monthlyWrap">
          <label for="aDom">On day of the month</label>
          <input id="aDom" type="number" min="1" max="31" value="1">
        </div>
        <div id="taskConnect"></div>
      </div>

      <div id="addMsg" class="msg msg-err hidden"></div>
    </div>
    <div class="sheet-f">
      <button class="btn" id="aCancel">Cancel</button>
      <button class="btn btn-primary" id="aSave">Add</button>
    </div>`;
  modal(box);

  $('aStart').value = presetDate || todayKey();
  $('taskConnect').innerHTML = '';

  // Store chips. Ticking several is the whole point: one instruction, one
  // copy per store, each closed on its own day when you get there.
  const picked = new Set();
  [...STORES, 'Office'].forEach(name => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'storechip';
    chip.textContent = name;
    chip.setAttribute('aria-pressed', 'false');
    chip.onclick = () => {
      if (picked.has(name)) picked.delete(name); else picked.add(name);
      chip.setAttribute('aria-pressed', String(picked.has(name)));
      chip.classList.toggle('on', picked.has(name));
    };
    $('aStores').append(chip);
  });

  function syncRepeatFields() {
    const mode = $('aRepeat').value;
    $('weeklyWrap').classList.toggle('hidden', mode !== 'weekly');
    $('monthlyWrap').classList.toggle('hidden', mode !== 'monthly');
    const d = $('aStart').value;
    if (!d) return;
    // default the pattern to the date already chosen
    const dt = new Date(d + 'T00:00:00Z');
    if (mode === 'weekly') $('aDow').value = String(dt.getUTCDay());
    if (mode === 'monthly') $('aDom').value = String(dt.getUTCDate());
  }
  $('aRepeat').onchange = syncRepeatFields;
  $('aStart').onchange = syncRepeatFields;

  $('aCancel').onclick = closeModal;

  $('aSave').onclick = async () => {
    const title = $('aTitle').value.trim();
    const start = $('aStart').value;
    const msg = $('addMsg');
    msg.classList.add('hidden');

    if (!title || !start) {
      msg.textContent = 'Add a name and a date.';
      msg.classList.remove('hidden');
      return;
    }

    const btn = $('aSave');
    btn.disabled = true; btn.textContent = 'Adding…';

    // No store picked still means one task, with no location on it.
    const targets = picked.size ? [...picked] : [null];
    const many = targets.length > 1;
    const repeat = $('aRepeat').value;

    if (repeat !== 'none') {
      // One repeat rule per store, so each generates its own occurrences and
      // can be stopped or rescheduled without touching the others.
      const failures = [];
      for (const where of targets) {
        const { error } = await sb.rpc('fn_create_recurrence', {
          p_text: title,
          p_category: $('aKind').value,
          p_type: repeat,
          p_day_of_week: repeat === 'weekly' ? Number($('aDow').value) : null,
          p_day_of_month: repeat === 'monthly' ? Number($('aDom').value) : null,
          p_start: start,
          p_location: where,
        });
        if (error) failures.push((where || 'no store') + ': ' + error.message);
      }
      btn.disabled = false; btn.textContent = 'Add';
      if (failures.length === targets.length) {
        msg.textContent = failures[0];
        msg.classList.remove('hidden');
        return;
      }
      closeModal();
      await refresh();
      toast(many ? `Repeating task added at ${targets.length} stores.`
                 : 'Repeating task added.');
      // Never swallow a partial failure — a sweep that quietly covered four
      // of five stores is worse than one that says so.
      if (failures.length) toast('Some stores failed: ' + failures.join('; '));
      return;
    }

    let made = 0;
    for (const where of targets) {
      const ok = await createTask({
        text: title,
        date: start,
        category: $('aKind').value,
        priority: $('aPriority').checked,
        note: $('aNote').value.trim(),
        location: where,
      });
      if (ok) made++;
    }
    btn.disabled = false; btn.textContent = 'Add';
    if (!made) return;
    closeModal();
    await refresh();
    toast(many ? `Added at ${made} of ${targets.length} stores.` : 'Task added.');
  };
}


/* ---------- repeating tasks ---------- */
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function describeRule(r) {
  if (r.type === 'weekly')  return 'Every ' + DAY_NAMES[r.day_of_week];
  if (r.type === 'monthly') return 'Day ' + r.day_of_month + ' of each month';
  return 'Every day';
}

/* ---------- refresh from sources ---------- */
async function runSync() {
  const btn = $('btnRefresh');
  btn.disabled = true; btn.textContent = 'Refreshing…';
  try {
    const { data } = await sb.auth.getSession();
    const token = data?.session?.access_token;
    const res = await fetch('/api/sync', { headers: { Authorization: `Bearer ${token}` } });
    const body = await res.json().catch(() => ({}));

    if (res.status === 401) {
      toast('The refresh service rejected the request. Check the deployment settings.');
    } else if (body.ok) {
      await refresh();
      toast('All sources refreshed.');
    } else {
      const bad = (body.sources || []).filter(s => !s.ok).map(s => s.source);
      await refresh();
      toast(bad.length ? `Refreshed, but these did not report: ${bad.join(', ')}` : 'Refresh finished with errors.');
    }
  } catch {
    toast('Could not reach the refresh service.');
  }
  btn.disabled = false; btn.textContent = 'Refresh now';
}

/* ---------- backup ----------
   Almost everything here is a copy that a sync can rebuild. Your own entries
   and the access list are not — they exist nowhere else. */
async function exportBackup() {
  const btn = $('btnExport');
  btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const [local, access] = await Promise.all([
      sb.from('local_events').select('*').order('starts_at', { ascending: true }),
      sb.from('app_access').select('*'),
    ]);
    if (local.error) throw local.error;

    const payload = {
      exported_at: new Date().toISOString(),
      note: 'Entries you added yourself, plus the access list. Synced events are not included \u2014 those rebuild from the source apps.',
      local_events: local.data || [],
      app_access: access.data || [],
    };
    const stamp = todayKey();
    const blob = new Blob([JSON.stringify(payload, null, 2)],
      { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `calendar-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(`Backed up ${payload.local_events.length} of your entries.`);
  } catch (err) {
    if (!handleAuthError(err)) toast('Could not build the backup: ' + (err.message || err));
  }
  btn.disabled = false; btn.textContent = 'Back up my entries';
}
