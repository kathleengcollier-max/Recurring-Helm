}

/* ---------- expired session ---------- */
function showSignIn(message) {
  $('app').classList.add('hidden');
  $('signin').classList.remove('hidden');
  closeModal();
  if (message) {
    const m = $('signinMsg');
    m.textContent = message;
    m.classList.remove('hidden');
  }
}

// Returns true if it handled the error, so callers can stop there.
function handleAuthError(err) {
  const text = String(err?.message || err || '').toLowerCase();
  const looksExpired = err?.status === 401 || err?.code === 'PGRST301' ||
    text.includes('jwt') || text.includes('token is expired') ||
    text.includes('invalid claim');
  if (!looksExpired) return false;
  showSignIn('Your session expired. Sign in again to carry on.');
  return true;
}

/* ---------- remembering your filters ---------- */
const PREFS_KEY = 'calhub:prefs:v1';

function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      view: state.view,
      listAll: state.listAll,
      planBy: state.planBy,
      hideSensitive: state.hideSensitive,
      showDone: state.showDone,
      offSources: [...state.offSources],
      offCats: [...state.offCats],
    }));
  } catch { /* private browsing, or storage full \u2014 not worth interrupting for */ }
}

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    // "all" used to be a view of its own. A browser that saved it becomes
    // the list with See all switched on, rather than falling back to a
    // default and silently losing the choice.
    if (p.view === 'all') { state.view = 'list'; state.listAll = true; }
    else if (['list', 'month', 'planner'].includes(p.view)) state.view = p.view;
    if (typeof p.listAll === 'boolean') state.listAll = p.listAll;
    if (p.planBy === 'store' || p.planBy === 'date') state.planBy = p.planBy;
    state.hideSensitive = Boolean(p.hideSensitive);
    state.showDone = Boolean(p.showDone);
    state.offSources = new Set(Array.isArray(p.offSources) ? p.offSources : []);
    state.offCats = new Set(Array.isArray(p.offCats) ? p.offCats : []);
  } catch { /* ignore anything unreadable and start fresh */ }
}

// Reflect restored preferences in the buttons before the first render
function applyPrefsToControls() {
  $('btnSensitive').setAttribute('aria-pressed', String(state.hideSensitive));
  $('btnSensitive').textContent = state.hideSensitive ? 'Sensitive hidden' : 'Hide sensitive';
  $('cbShowDone').checked = state.showDone;
  $('btnMonth').setAttribute('aria-pressed', String(state.view === 'month'));
  $('btnList').setAttribute('aria-pressed', String(state.view === 'list'));
  $('btnPlan').setAttribute('aria-pressed', String(state.view === 'planner'));
}

/* ---------- render ---------- */
function render() {
  const plan = state.view === 'planner';
  const list = state.view === 'list';
  const all  = list && state.listAll;      // "See all" only exists in the list

  // Stepping a month means nothing when every month is on screen, and the
  // Planner is anchored to today rather than to the month being browsed.
  $('periodLabel').textContent =
    all ? 'All dates' : plan ? 'Planner' : monthFmt.format(state.cursor);
  ['btnPrev', 'btnNext', 'btnToday'].forEach(id => {
    $(id).disabled = all || plan;
    $(id).style.opacity = (all || plan) ? 0.4 : '';
  });

  // Each toggle belongs to one view, so it is only there while that view is.
  $('btnSeeAll').classList.toggle('hidden', !list);
  $('btnSeeAll').setAttribute('aria-pressed', String(all));
  $('btnSeeAll').textContent = all ? 'Showing all' : 'See all';

  const byStore = plan && state.planBy === 'store';
  $('btnByStore').classList.toggle('hidden', !plan);
  $('btnByStore').setAttribute('aria-pressed', String(byStore));
  // Same grammar as See all beside it: name the action when it is off, the
  // state when it is on. Labelling the current grouping in both positions
  // read backwards — "By store" looked like a button that would take you there.
  $('btnByStore').textContent = byStore ? 'Grouped by store' : 'By store';
  $('btnByStore').title = byStore
    ? 'Back to grouping by date — overdue, today, and the week ahead'
    : 'Group by store instead — everything open at each location, from every app';

  renderSidebar();
  $('monthWrap').classList.toggle('hidden', state.view !== 'month');
  $('listWrap').classList.toggle('hidden', !list);
  $('planWrap').classList.toggle('hidden', !plan);
  if (state.view !== 'month') $('running').classList.add('hidden');

  if (state.view === 'month') renderMonth();
  else if (plan) renderPlanner();
  else renderList(all);
}

async function refresh() {
  await loadAll();
  render();
}

// A session can lapse while the tab sits open; catch it rather than
// leaving yesterday's calendar on screen looking current.
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') showSignIn();
});

/* ---------- wiring ---------- */
function bind() {
  $('btnPrev').onclick = () => { state.cursor.setMonth(state.cursor.getMonth() - 1); render(); };
  $('btnNext').onclick = () => { state.cursor.setMonth(state.cursor.getMonth() + 1); render(); };
  $('btnToday').onclick = () => { state.cursor = new Date(); render(); };

  const VIEWS = { month: 'btnMonth', list: 'btnList', planner: 'btnPlan' };
  function setView(v) {
    state.view = v;
    Object.entries(VIEWS).forEach(([name, id]) =>
      $(id).setAttribute('aria-pressed', String(name === v)));
    savePrefs(); render();
  }
  $('btnMonth').onclick = () => setView('month');
  $('btnList').onclick  = () => setView('list');
  $('btnPlan').onclick  = () => setView('planner');
  $('btnSeeAll').onclick = () => {
    state.listAll = !state.listAll;
    savePrefs(); render();
  };
  $('btnByStore').onclick = () => {
    state.planBy = state.planBy === 'store' ? 'date' : 'store';
    savePrefs(); render();
  };

  $('btnSensitive').onclick = () => {
    state.hideSensitive = !state.hideSensitive;
    $('btnSensitive').setAttribute('aria-pressed', String(state.hideSensitive));
    $('btnSensitive').textContent = state.hideSensitive ? 'Sensitive hidden' : 'Hide sensitive';
    savePrefs(); render();
  };

  // Not `= openAdd` — that hands the click event in as presetDate, which the
  // date input rejects, so the field opened blank instead of on today.
  $('btnAdd').onclick = () => openAdd();
  $('cbShowDone').onchange = () => {
    state.showDone = $('cbShowDone').checked;
    savePrefs(); render();
  };
  // Turning everything off is a normal thing to want — it leaves only your
  // own entries and tasks, which is a useful view in itself.
  $('srcAll').onclick = () => { state.offSources.clear(); savePrefs(); render(); };
  $('srcNone').onclick = () => {
    allSourceKeys().forEach(k => state.offSources.add(k));
    savePrefs(); render();
  };
  $('catAll').onclick = () => { state.offCats.clear(); savePrefs(); render(); };
  $('catNone').onclick = () => {
    allCategoryKeys().forEach(c => state.offCats.add(c));
    savePrefs(); render();
  };

  $('btnRepeats').onclick = openRepeats;
  $('btnExport').onclick = exportBackup;
  $('btnWhatsNew').onclick = openWhatsNew;
  $('btnVersion').onclick = openWhatsNew;
  $('btnVersion').textContent = 'v' + APP_VERSION;
  $('btnRefresh').onclick = runSync;
  $('btnSignout').onclick = signOut;

  $('btnSide').onclick = () => document.body.classList.toggle('side-open');
  $('scrimSide').onclick = () => document.body.classList.remove('side-open');

  $('btnGoogle').onclick = signInGoogle;
  $('btnPwToggle').onclick = () => {
    const block = $('pwBlock');
    const showing = !block.classList.contains('hidden');
    block.classList.toggle('hidden');
    $('btnPwToggle').textContent = showing ? 'Use a password instead' : 'Use Google instead';
    if (!showing) $('email').focus();
  };
  $('btnSignin').onclick = signIn;
  ['email', 'password'].forEach(id => {
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
  });

  let last = window.innerWidth;
  window.addEventListener('resize', () => {
    const crossed = (last < 860) !== (window.innerWidth < 860);
    last = window.innerWidth;
    if (crossed && state.view === 'month') render();
  });
}

/* ---------- startup ---------- */
async function start() {
  $('signin').classList.add('hidden');
  $('app').classList.remove('hidden');
  applyPrefsToControls();
  try {
    await refresh();
  } catch (err) {
    if (handleAuthError(err)) return;
    const msg = String(err?.message || err);
    $('grid').innerHTML =
      `<div class="empty" style="grid-column:1/-1"><p>Couldn\u2019t load the calendar.</p>
       <small>${esc(msg)}</small></div>`;
  }
}

(async function init() {
  // As the sign-in popup, do nothing but pass the session back and close.
  if (window.opener && location.search.includes(POPUP_MARKER)) {
    document.body.innerHTML =
      '<p style="font:14px system-ui;color:#6B7A8D;padding:28px">Signing you in…</p>';
    await completeAuthPopup();
    return;
  }

  bind();
  loadPrefs();

  const { data } = await sb.auth.getSession();
  if (data?.session) await start();
})();
</script>
