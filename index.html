/* ---------- Date helpers ---------- */

const uid = () => Math.random().toString(36).slice(2, 10);
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const today = () => startOfDay(new Date());
const toISO = (d) => { const x = startOfDay(d); const m = String(x.getMonth() + 1).padStart(2, "0"); const day = String(x.getDate()).padStart(2, "0"); return `${x.getFullYear()}-${m}-${day}`; };
const fromISO = (s) => startOfDay(new Date(s + "T00:00:00"));
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const addYears = (d, n) => { const x = new Date(d); x.setFullYear(x.getFullYear() + n); return x; };
const sameDayMonths = (d, n) => { const day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); return startOfDay(new Date(t.getFullYear(), t.getMonth(), Math.min(day, last))); };
const diffDays = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
const nextWeekday = (from, target) => { const d = startOfDay(from); const diff = ((target - d.getDay()) + 7) % 7; return addDays(d, diff); };
const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;
const firstBusinessDay = (year, month) => { let d = new Date(year, month, 1); while (isWeekend(d)) d = addDays(d, 1); return startOfDay(d); };
const lastBusinessDay = (year, month) => { let d = new Date(year, month + 1, 0); while (isWeekend(d)) d = addDays(d, -1); return startOfDay(d); };
const nextFirstBusinessDay = (from) => { const f = startOfDay(from); let v = firstBusinessDay(f.getFullYear(), f.getMonth()); if (v < f) { const nx = addMonths(new Date(f.getFullYear(), f.getMonth(), 1), 1); v = firstBusinessDay(nx.getFullYear(), nx.getMonth()); } return v; };
const nextLastBusinessDay = (from) => { const f = startOfDay(from); let v = lastBusinessDay(f.getFullYear(), f.getMonth()); if (v < f) { const nx = addMonths(new Date(f.getFullYear(), f.getMonth(), 1), 1); v = lastBusinessDay(nx.getFullYear(), nx.getMonth()); } return v; };
const fmtShort = (iso) => { const d = fromISO(iso); return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = (iso) => { const d = fromISO(iso); return `${WEEKDAYS_SHORT[d.getDay()]}, ${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`; };
const fmtLongY = (iso) => { const d = fromISO(iso); return `${WEEKDAYS_SHORT[d.getDay()]}, ${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const relDay = (iso) => {
  const n = diffDays(fromISO(iso), today());
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n < 0) return `${Math.abs(n)} days ago`;
  if (n < 7) return `In ${n} days`;
  return fmtShort(iso);
};
const unitLabel = (r) => { const n = Math.max(1, r.interval || 1); const base = { daily: "day", weekly: "week", monthly: "month", quarterly: "quarter", yearly: "year" }[r.frequency] || "time"; return n > 1 ? base + "s" : base; };
const recurLabel = (r) => {
  if (!r) return "";
  const n = Math.max(1, r.interval || 1);
  if (r.frequency === "weekly") { const d = r.weekday != null ? WEEKDAYS_SHORT[r.weekday] : "weekly"; return n > 1 ? `${d} ·${n}w` : d; }
  if (r.frequency === "daily") return r.weekdaysOnly ? (n > 1 ? `every ${n}d · wkdys` : "weekdays") : (n > 1 ? `every ${n}d` : "daily");
  if ((r.frequency === "monthly" || r.frequency === "quarterly") && r.anchor === "fbd") return (r.frequency === "monthly" ? "1st business day" : "1st bus. day/Q") + (n > 1 ? ` ·${n}` : "");
  if ((r.frequency === "monthly" || r.frequency === "quarterly") && r.anchor === "lbd") return (r.frequency === "monthly" ? "last business day" : "last bus. day/Q") + (n > 1 ? ` ·${n}` : "");
  if (r.frequency === "monthly") return n > 1 ? `every ${n} months` : "monthly";
  if (r.frequency === "quarterly") return n > 1 ? `every ${n} quarters` : "quarterly";
  if (r.frequency === "yearly") return n > 1 ? `every ${n} years` : "yearly";
  return r.frequency;
};

/* ---------- Holidays ---------- */

const nthWeekday = (year, month, weekday, n) => { const first = new Date(year, month, 1); const offset = (weekday - first.getDay() + 7) % 7; return startOfDay(new Date(year, month, 1 + offset + (n - 1) * 7)); };
const lastWeekday = (year, month, weekday) => { const last = new Date(year, month + 1, 0); const offset = (last.getDay() - weekday + 7) % 7; return startOfDay(new Date(year, month, last.getDate() - offset)); };
const holidayForYear = (name, year) => {
  switch (name) {
    case "new year": case "new years": return startOfDay(new Date(year, 0, 1));
    case "memorial day": return lastWeekday(year, 4, 1);
    case "independence day": case "july 4th": case "fourth of july": return startOfDay(new Date(year, 6, 4));
    case "labor day": return nthWeekday(year, 8, 1, 1);
    case "halloween": return startOfDay(new Date(year, 9, 31));
    case "thanksgiving": return nthWeekday(year, 10, 4, 4);
    case "christmas": case "xmas": return startOfDay(new Date(year, 11, 25));
    default: return null;
  }
};
const nextHoliday = (name, from) => { const y = from.getFullYear(); let h = holidayForYear(name, y); if (!h) return null; if (h < from) h = holidayForYear(name, y + 1); return h; };
const HOLIDAY_KEYS = ["new year", "memorial day", "independence day", "july 4th", "labor day", "halloween", "thanksgiving", "christmas"];

/* ---------- Natural language parser ---------- */

const AREA_KEYWORDS = [
  [/\b(aging|a\/?r|receivable|collection)/i, "Accounting", "AR"],
  [/\b(a\/?p|payable)/i, "Accounting", "AP"],
  [/\b(bank rec|reconcil)/i, "Accounting", "Bank Recs"],
  [/\b(financ|cash position|p&l|balance sheet|close)/i, "Accounting", "Financials"],
  [/\b(audit|1099)/i, "Accounting", "Audit"],
  [/\b(rebate|accrual|budget|depreciation|tax)/i, "Accounting", null],
  [/\b(cycle count|inventory|stock)/i, "Operations", "Inventory"],
  [/\b(freight|shipping|carrier|ltl)/i, "Operations", "Freight"],
  [/\b(fleet|truck|vehicle)/i, "Operations", "Fleet"],
  [/\b(facilit|building|hvac unit|lease repair)/i, "Operations", "Facilities"],
  [/\b(counter sales|counter)/i, "Sales", "Counter"],
  [/\b(outside sales|ride[\s-]?along|territory)/i, "Sales", "Outside Sales"],
  [/\b(quote|bid|takeoff)/i, "Sales", "Quotes"],
  [/\b(key account|major account|national account)/i, "Sales", "Key Accounts"],
  [/\b(commission|sales report|sales call|sales rep)/i, "Sales", null],
  [/\b(performance review|employee review|annual review|1[\s-]?on[\s-]?1)/i, "HR", "Reviews"],
  [/\b(training|onboard)/i, "HR", "Training"],
  [/\b(recruit|hir(e|ing)|interview|candidate)/i, "HR", "Recruiting"],
  [/\b(flyer)/i, "Marketing", "Flyers"],
  [/\b(vendor day)/i, "Marketing", "Vendor Days"],
  [/\b(promo|promotion|sale event|social post|email customers)/i, "Marketing", "Promotions"],
  [/\b(vendor agreement|vendor onboard|supplier|vendor)\b/i, "Vendor", null],
  [/\b(server|network|laptop|computer|printer|software|license|vpn|it ticket|password reset|email account)\b/i, "IT", null],
  [/\b(lease|renewal|amendment)/i, "Projects", null],
];
const STORE_KEYWORDS = [
  [/\banaheim\b|\ban\b/i, "AN"],
  [/\blong beach\b|\blb\b/i, "LB"],
  [/\bsanta ana\b|\bsa\b/i, "SA"],
  [/\blaguna\b|\blh\b/i, "LH"],
  [/\bhub\b/i, "HUB"],
  [/\bcorporate\b|\bcorp\b/i, "Corporate"],
];

function titleCase(s) { return s.trim().replace(/^\w/, (c) => c.toUpperCase()); }

function parseNatural(raw) {
  let text = raw.trim();
  const result = { title: text, area: "Personal", subArea: null, stores: [], recurrence: null, dueDate: null, parsedNote: "" };
  text = text.replace(/^(please\s+)?(remind me to|remind me|remember to|i need to|need to|todo:?)\s+/i, "");

  const beforeMatch = text.match(/(\d+)\s*days?\s*before\s*(the\s*)?([a-z'\s]+?)(\s+holiday)?$/i);
  if (beforeMatch) {
    const days = parseInt(beforeMatch[1], 10);
    const hname = beforeMatch[3].trim().toLowerCase().replace(/^the\s+/, "");
    const key = HOLIDAY_KEYS.find((k) => hname.includes(k) || k.includes(hname));
    if (key) {
      let event = nextHoliday(key, today());
      let trigger = addDays(event, -days);
      if (trigger < today()) { event = holidayForYear(key, event.getFullYear() + 1); trigger = addDays(event, -days); }
      result.dueDate = toISO(trigger);
      result.parsedNote = `Due ${fmtLong(toISO(trigger))} (${days} days before ${titleCase(key)} on ${fmtShort(toISO(event))})`;
      text = text.replace(beforeMatch[0], "").trim();
    }
  }

  const wdMatch = text.match(/\bevery\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)s?\b/i);
  const everyOtherWd = text.match(/\bevery other\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)s?\b/i);
  const everyNUnit = text.match(/\bevery\s+(\d+)\s+(day|week|month|quarter|year)s?\b/i);
  const everyOtherUnit = text.match(/\bevery other\s+(day|week|month|quarter|year)\b/i);
  const biweekly = /\b(biweekly|bi-weekly|fortnightly)\b/i.test(text);
  const freqFor = (u) => ({ day: "daily", week: "weekly", month: "monthly", quarter: "quarterly", year: "yearly" }[u]);
  if (everyOtherWd) {
    const wd = WEEKDAYS.findIndex((d) => d.toLowerCase() === everyOtherWd[1].toLowerCase());
    result.recurrence = { frequency: "weekly", weekday: wd, behavior: "must", interval: 2 };
    result.dueDate = toISO(nextWeekday(today(), wd));
    result.parsedNote = `Repeats every other ${WEEKDAYS[wd]}`;
    text = text.replace(everyOtherWd[0], "").trim();
  } else if (biweekly) {
    const wd = today().getDay();
    result.recurrence = { frequency: "weekly", weekday: wd, behavior: "must", interval: 2 };
    result.dueDate = toISO(today());
    result.parsedNote = "Repeats every 2 weeks";
    text = text.replace(/\b(biweekly|bi-weekly|fortnightly)\b/i, "").trim();
  } else if (everyNUnit) {
    const n = Math.max(1, parseInt(everyNUnit[1], 10) || 1);
    const freq = freqFor(everyNUnit[2].toLowerCase());
    result.recurrence = { frequency: freq, weekday: freq === "weekly" ? today().getDay() : null, behavior: "must", interval: n, ...((freq === "monthly" || freq === "quarterly") ? { anchor: "date" } : {}) };
    result.dueDate = toISO(today());
    result.parsedNote = `Repeats every ${n} ${everyNUnit[2].toLowerCase()}${n > 1 ? "s" : ""}`;
    text = text.replace(everyNUnit[0], "").trim();
  } else if (everyOtherUnit) {
    const freq = freqFor(everyOtherUnit[1].toLowerCase());
    result.recurrence = { frequency: freq, weekday: freq === "weekly" ? today().getDay() : null, behavior: "must", interval: 2, ...((freq === "monthly" || freq === "quarterly") ? { anchor: "date" } : {}) };
    result.dueDate = toISO(today());
    result.parsedNote = `Repeats every other ${everyOtherUnit[1].toLowerCase()}`;
    text = text.replace(everyOtherUnit[0], "").trim();
  } else if (wdMatch) {
    const wd = WEEKDAYS.findIndex((d) => d.toLowerCase() === wdMatch[1].toLowerCase());
    result.recurrence = { frequency: "weekly", weekday: wd, behavior: "must" };
    result.dueDate = toISO(nextWeekday(today(), wd));
    result.parsedNote = result.parsedNote || `Repeats weekly on ${WEEKDAYS[wd]}`;
    text = text.replace(wdMatch[0], "").trim();
  } else if (/\b(every weekday|each weekday|weekdays|every business day|business days|daily except weekends)\b/i.test(text)) {
    const mwd = text.match(/\b(every weekday|each weekday|weekdays|every business day|business days|daily except weekends)\b/i);
    let d = today(); while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
    result.recurrence = { frequency: "daily", weekday: null, behavior: "must", interval: 1, weekdaysOnly: true };
    result.dueDate = toISO(d);
    result.parsedNote = "Repeats every weekday";
    text = text.replace(mwd[0], "").trim();
  } else if (/\b(every day|daily|each day)\b/i.test(text)) {
    result.recurrence = { frequency: "daily", weekday: null, behavior: "must" };
    result.dueDate = toISO(today());
    result.parsedNote = result.parsedNote || "Repeats daily";
    text = text.replace(/\b(every day|daily|each day)\b/i, "").trim();
  } else if (/\b(every week|weekly)\b/i.test(text)) {
    const wd = today().getDay();
    result.recurrence = { frequency: "weekly", weekday: wd, behavior: "must" };
    result.dueDate = toISO(today());
    result.parsedNote = result.parsedNote || `Repeats weekly on ${WEEKDAYS[wd]}`;
    text = text.replace(/\b(every week|weekly)\b/i, "").trim();
  } else if (/\b(every quarter|quarterly)\b/i.test(text)) {
    result.recurrence = { frequency: "quarterly", weekday: null, behavior: "must", anchor: "date" };
    result.dueDate = toISO(today());
    result.parsedNote = result.parsedNote || "Repeats quarterly";
    text = text.replace(/\b(every quarter|quarterly)\b/i, "").trim();
  } else if (/\b(every month|monthly|each month)\b/i.test(text)) {
    result.recurrence = { frequency: "monthly", weekday: null, behavior: "must", anchor: "date" };
    result.dueDate = toISO(today());
    result.parsedNote = result.parsedNote || "Repeats monthly";
    text = text.replace(/\b(every month|monthly|each month)\b/i, "").trim();
  } else if (/\b(every year|yearly|annually|each year)\b/i.test(text)) {
    result.recurrence = { frequency: "yearly", weekday: null, behavior: "must" };
    result.dueDate = toISO(today());
    result.parsedNote = result.parsedNote || "Repeats yearly";
    text = text.replace(/\b(every year|yearly|annually|each year)\b/i, "").trim();
  }

  if (result.recurrence && (result.recurrence.frequency === "monthly" || result.recurrence.frequency === "quarterly")) {
    if (/last business day/i.test(raw)) {
      result.recurrence.anchor = "lbd";
      result.dueDate = toISO(nextLastBusinessDay(today()));
      result.parsedNote = `Repeats ${result.recurrence.frequency} on the last business day`;
      text = text.replace(/(on the\s+)?last\s+business day( of (the|every) month)?/i, "").trim();
    } else if (/first business day|1st business day|business day/i.test(raw)) {
      result.recurrence.anchor = "fbd";
      result.dueDate = toISO(nextFirstBusinessDay(today()));
      result.parsedNote = `Repeats ${result.recurrence.frequency} on the first business day`;
      text = text.replace(/(on the\s+)?(first|1st)\s+business day( of (the|every) month)?/i, "").trim();
    }
  }

  if (!result.recurrence && !result.dueDate) {
    if (/\btomorrow\b/i.test(text)) { result.dueDate = toISO(addDays(today(), 1)); text = text.replace(/\btomorrow\b/i, "").trim(); }
    else if (/\btoday\b/i.test(text)) { result.dueDate = toISO(today()); text = text.replace(/\btoday\b/i, "").trim(); }
    else {
      const nextWd = text.match(/\bnext\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i);
      if (nextWd) { const wd = WEEKDAYS.findIndex((d) => d.toLowerCase() === nextWd[1].toLowerCase()); result.dueDate = toISO(nextWeekday(addDays(today(), 1), wd)); text = text.replace(nextWd[0], "").trim(); }
    }
  }

  for (const [re, area, sub] of AREA_KEYWORDS) { if (re.test(raw)) { result.area = area; result.subArea = sub; break; } }
  for (const [re, store] of STORE_KEYWORDS) { if (re.test(raw) && !result.stores.includes(store)) result.stores.push(store); }

  text = text.replace(/\b(on|for|at|to|of the month)\s*$/i, "").replace(/\s{2,}/g, " ").trim();
  result.title = titleCase(text || raw);
  if (!result.parsedNote) result.parsedNote = result.dueDate ? `Due ${relDay(result.dueDate)}` : "Added with no date — find it under its Area";
  return result;
}

function blankTask() {
  return { id: uid(), title: "", area: "Personal", subArea: null, stores: [], recurrence: null, dueDate: null, completed: false, completedAt: null, lastCompleted: null, subtasks: [], notes: "", links: [], createdAt: new Date().toISOString() };
}
const mk = (o) => ({ ...blankTask(), ...o });
const mkLog = (t) => ({ id: uid(), taskId: t.id, title: t.title, area: t.area, completedAt: new Date().toISOString() });

const IMPORT_HEADERS = ["Title", "Area", "Sub-area", "Due date", "Stores", "Repeat", "Repeat every", "Repeat day", "Repeat anchor", "If missed", "Checklist", "Notes"];

function importRowToTask(row) {
  const get = (k) => { for (const key of Object.keys(row)) { if (key.trim().toLowerCase() === k) return row[key]; } return ""; };
  const title = String(get("title") || "").trim();
  if (!title) return null;
  const areaRaw = String(get("area") || "").trim();
  const area = AREA_NAMES.find((a) => a.toLowerCase() === areaRaw.toLowerCase()) || "Other";
  const subRaw = String(get("sub-area") || get("subarea") || "").trim();
  const subArea = AREAS[area].subs.find((x) => x.toLowerCase() === subRaw.toLowerCase()) || (subRaw || null);
  const parseDate = (v) => { if (!v) return null; if (v instanceof Date && !isNaN(v)) return toISO(v); const str = String(v).trim(); if (!str) return null; const d = new Date(str); return isNaN(d) ? null : toISO(d); };
  const due = parseDate(get("due date") || get("due"));
  const stores = String(get("stores") || "").split(/[;,]/).map((x) => x.trim()).filter(Boolean).map((x) => STORES.find((sx) => sx.toLowerCase() === x.toLowerCase())).filter(Boolean);

/* ---------- Recurrence engine ---------- */

function nextOccurrence(task) {
  const r = task.recurrence;
  const cur = fromISO(task.dueDate);
  const iv = Math.max(1, r.interval || 1);
  if (r.frequency === "daily") { let d = addDays(cur, iv); if (r.weekdaysOnly) { while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); } return toISO(d); }
  if (r.frequency === "weekly") return toISO(addDays(cur, 7 * iv));
  if (r.frequency === "monthly") {
    const base = new Date(cur.getFullYear(), cur.getMonth(), 1);
    if (r.anchor === "fbd") { const nx = addMonths(base, iv); return toISO(firstBusinessDay(nx.getFullYear(), nx.getMonth())); }
    if (r.anchor === "lbd") { const nx = addMonths(base, iv); return toISO(lastBusinessDay(nx.getFullYear(), nx.getMonth())); }
    return toISO(sameDayMonths(cur, iv));
  }
  if (r.frequency === "quarterly") {
    const m = 3 * iv;
    const base = new Date(cur.getFullYear(), cur.getMonth(), 1);
    if (r.anchor === "fbd") { const nx = addMonths(base, m); return toISO(firstBusinessDay(nx.getFullYear(), nx.getMonth())); }
    if (r.anchor === "lbd") { const nx = addMonths(base, m); return toISO(lastBusinessDay(nx.getFullYear(), nx.getMonth())); }
    return toISO(sameDayMonths(cur, m));
  }
  if (r.frequency === "yearly") return toISO(addYears(cur, iv));
  return task.dueDate;
}

function rollForward(tasks) {
  const now = today();
  return tasks.map((t) => {
    let task = { ...t };
    if (task.isFutureMe) { task.dueDate = task.dueDate || task.triggerDate; task.isFutureMe = false; task.triggerDate = null; } // migrate any legacy filed task to a normal dated task
    if (task.isMilestone) { task.isMilestone = false; } // milestones retired -> normal task
    if (task.recurrence && task.dueDate && !task.completed) {
      const beh = task.recurrence.behavior;
      const until = task.recurrence.until;
      if (until && fromISO(task.dueDate) > fromISO(until)) {
        task.completed = true;
      } else if (beh !== "must") {
        let guard = 0;
        while (fromISO(task.dueDate) < now && guard < 500) {
          const nx = nextOccurrence(task);
          if (until && fromISO(nx) > fromISO(until)) { task.completed = true; break; }
          task.dueDate = nx; guard++;
        }
        if (beh === "auto") task.subtasks = task.subtasks.map((s) => ({ ...s, done: false }));
      }
    }
    return task;
  });
}

function forecastOccurrences(task, n = 2) {
  if (!task.recurrence || !task.dueDate) return [];
  const until = task.recurrence.until;
  const out = []; let t = { ...task }; let guard = 0;
  while (out.length < n && guard < 200) {
    const nx = nextOccurrence(t);
    if (!nx || nx === t.dueDate) break;
    if (until && fromISO(nx) > fromISO(until)) break;
    out.push(nx); t = { ...t, dueDate: nx }; guard++;
  }
  return out;
}

        setTasks(rollForward(snap.tasks || []));
        setCustomTemplates(Array.isArray(snap.customTemplates) ? snap.customTemplates : []);
        setCompletionLog(Array.isArray(snap.completionLog) ? snap.completionLog : []);
        setSelected(null);
        setNotice({ type: "success", text: `Restored the snapshot from ${fmtLong(snap.date)}.` });
      },
    });
  };

  const skipOccurrence = (id) => {
    const t = tasks.find((x) => x.id === id);
    if (!t || !t.recurrence || !t.dueDate) return;
    const next = nextOccurrence(t);
    const until = t.recurrence.until;
    if (until && fromISO(next) > fromISO(until)) {
      upsert({ ...t, completed: true, completedAt: null, subtasks: t.subtasks.map((s) => ({ ...s, done: false })) });
      setNotice({ type: "success", text: `Skipped — "${t.title}" had no occurrences left, so it's closed.` });
    } else {
      upsert({ ...t, subtasks: t.subtasks.map((s) => ({ ...s, done: false })) , dueDate: next });
      setNotice({ type: "success", text: `Skipped — "${t.title}" jumps to ${relDay(next)}.` });
    }
    setSelected(null);
  };

  const backup = () => {
    download(`helm-backup-${toISO(today())}.json`, JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), tasks, customTemplates, completionLog }, null, 2));
    setLastBackup(toISO(today()));
    setNotice({ type: "success", text: "Backup downloaded." });
  };

  const exportCSV = () => {
    const esc = (v) => { const str = v == null ? "" : String(v); return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str; };
    const header = ["Title", "Area", "Sub-area", "Stores", "Date", "Type", "Recurrence", "If missed", "Ends", "Status", "Checklist", "Notes"];
    const rows = tasks.map((t) => {
      const date = t.dueDate;
      const type = t.recurrence ? "Recurring" : "Task";
      const rl = t.recurrence ? recurLabel(t.recurrence) : "";
      const rec = t.recurrence ? (rl === t.recurrence.frequency ? t.recurrence.frequency : `${t.recurrence.frequency} (${rl})`) : "";
      const status = t.completed ? "Completed" : (date && fromISO(date) < today() ? "Overdue" : "Open");
      const chk = t.subtasks.length ? `${t.subtasks.filter((s) => s.done).length}/${t.subtasks.length}` : "";
      return [t.title, t.area, t.subArea || "", t.stores.join("; "), date || "", type, rec, t.recurrence ? t.recurrence.behavior : "", t.recurrence && t.recurrence.until ? t.recurrence.until : "", status, chk, t.notes].map(esc).join(",");
    });
    download(`helm-tasks-${toISO(today())}.csv`, [header.join(","), ...rows].join("\n"));
    setNotice({ type: "success", text: `Exported ${tasks.length} tasks to CSV.` });
  };

  const downloadTemplate = () => {
    const examples = [
      ["Review aging", "Accounting", "AR", "", "AN; LB", "weekly", "1", "Tuesday", "", "must", "Run report; Review over 60; Contact managers", "Weekly collections review"],
      ["Safety walk-through", "Operations", "Facilities", "", "", "weekly", "2", "Friday", "", "must", "", "Every other Friday"],
      ["Run month-end close", "Accounting", "Financials", "", "", "monthly", "1", "", "first business day", "must", "", "Kicks off the first business day"],
      ["Quarterly business review", "Sales", "Key Accounts", "", "", "monthly", "3", "", "date", "must", "", "Every 3 months on the same day"],
      ["Sales commission report", "Sales", "Outside Sales", "", "", "monthly", "1", "", "last business day", "must", "", "Due the last business day"],
      ["Lease renewal", "Projects", "", "2026-11-01", "", "", "", "", "", "", "", "A dated one-off task"],
    ];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([IMPORT_HEADERS, ...examples]);
    ws["!cols"] = IMPORT_HEADERS.map((h) => ({ wch: Math.max(12, h.length + 4) }));
    XLSX.utils.book_append_sheet(wb, ws, "Tasks");
    const instr = XLSX.utils.aoa_to_sheet([
      ["Helm — import template"],
      [""],
      ["Fill in the Tasks tab, one task per row. Only Title is required. Delete the example rows before importing."],
      [""],
      ["Column", "What to put"],
      ["Title", "Required. The task name."],
      ["Area", "One of: " + AREA_NAMES.join(", ") + ". Defaults to Other if blank/unknown."],
      ["Sub-area", "Optional. Match the area's sub-areas, or leave blank."],
      ["Due date", "YYYY-MM-DD (e.g. 2026-06-15). Leave blank for no date."],
      ["Stores", "Any of: " + STORES.join(", ") + ". Separate with ; or ,"],
      ["Repeat", "Blank, or one of: daily, weekly, monthly, quarterly, yearly"],
      ["Repeat every", "How many of that unit between repeats. 1 (or blank) = every time, 2 = every other, 3 = every third, etc."],
      ["Repeat day", "Weekly only: Monday, Tuesday, etc."],
      ["Repeat anchor", "Monthly/quarterly: date, first business day, or last business day"],
      ["If missed", "must (default), skip, or auto"],
      ["Checklist", "Steps separated by ; (e.g. Run report; Review over 60; Contact managers)"],
      ["Notes", "Free text."],
    ]);
    instr["!cols"] = [{ wch: 18 }, { wch: 90 }];
    XLSX.utils.book_append_sheet(wb, instr, "Instructions");
    const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    download("helm-import-template.xlsx", buf);
    setNotice({ type: "success", text: "Template downloaded — fill in the Tasks tab, then Import." });
  };

  const handleImport = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    let rows;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheet = wb.SheetNames.includes("Tasks") ? "Tasks" : wb.SheetNames[0];
      rows = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { defval: "" });
    } catch (err) { setNotice({ type: "block", text: "Couldn't read that spreadsheet. Use the Helm template (.xlsx or .csv)." }); e.target.value = ""; return; }
    e.target.value = "";
    const built = rows.map(importRowToTask).filter(Boolean);
    if (built.length === 0) { setNotice({ type: "block", text: "No rows with a Title were found." }); return; }
    setConfirm({
      title: `Import ${built.length} task${built.length > 1 ? "s" : ""}?`,
      message: "These get added to your existing tasks — nothing is overwritten. You can undo right after.",
      confirmLabel: "Import", danger: false,
      onConfirm: () => {
        const rolled = rollForward(built);
        const ids = rolled.map((t) => t.id);
        setTasks((p) => [...p, ...rolled]);
        setNotice({ type: "success", text: `Imported ${rolled.length} task${rolled.length > 1 ? "s" : ""}.`, action: { label: "Undo", onClick: () => { const set = new Set(ids); setTasks((p) => p.filter((t) => !set.has(t.id))); setNotice({ type: "success", text: "Import undone." }); } } });
      },
    });
  };

  const handleRestore = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); if (!data || !Array.isArray(data.tasks)) throw new Error("bad"); }
    catch (err) { setNotice({ type: "block", text: "That file couldn't be read as a Helm backup." }); e.target.value = ""; return; }
    e.target.value = "";
    setConfirm({
      title: "Restore from this backup file?",
      message: `This replaces your current data with ${data.tasks.length} tasks from the file. A safety snapshot of your current data is saved first.`,
      confirmLabel: "Restore", danger: true,
      onConfirm: () => {
        pushSnapshot("before restore");
        setTasks(rollForward(data.tasks));
        setCustomTemplates(Array.isArray(data.customTemplates) ? data.customTemplates : []);
        setCompletionLog(Array.isArray(data.completionLog) ? data.completionLog : []);
        setSelected(null);
        setNotice({ type: "success", text: `Restored ${data.tasks.length} tasks from backup.` });
      },
    });
  };

  const quickAdd = () => {
    if (!quick.trim()) return;
    const parsed = parseNatural(quick);
    const task = mk(parsed);
    upsert(task);
    setQuickFeedback({ id: task.id, title: task.title, note: parsed.parsedNote, area: task.area });
    setQuick("");
    clearTimeout(qfTimer.current);
    qfTimer.current = setTimeout(() => setQuickFeedback(null), 6000);
  };

  const resetAll = () => { setTasks(rollForward(seed())); setCustomTemplates([]); setCompletionLog(seedLog()); setSelected(null); };

  const clearAll = () => {
    const prev = { tasks, customTemplates, completionLog, todayOrder };
    pushSnapshot("before clear");
    setTasks([]); setCustomTemplates([]); setCompletionLog([]); setTodayOrder([]); setSelected(null);
    setNotice({ type: "success", text: "All data cleared — you're starting fresh.", action: { label: "Undo", onClick: () => { setTasks(prev.tasks); setCustomTemplates(prev.customTemplates); setCompletionLog(prev.completionLog); setTodayOrder(prev.todayOrder); setNotice({ type: "success", text: "Restored your data." }); } } });
  };


  const active = useMemo(() => tasks, [tasks]);
  const visible = useMemo(() => storeFilter ? active.filter((t) => t.stores.includes(storeFilter)) : active, [active, storeFilter]);
  const dueToday = visible.filter((t) => !t.completed && t.dueDate && diffDays(fromISO(t.dueDate), today()) === 0);
  const overdue = visible.filter((t) => !t.completed && t.dueDate && fromISO(t.dueDate) < today()).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const thisWeek = visible.filter((t) => { if (t.completed || !t.dueDate) return false; const d = diffDays(fromISO(t.dueDate), today()); return d >= 1 && d <= 7; });
  const weekDone = completionLog.filter((e) => startOfDay(new Date(e.completedAt)) >= addDays(today(), -6)).length;
  const storeAware = ["dashboard", "today", "areas", "calendar", "table"].includes(view);
  const todayList = useMemo(() => { const order = todayOrder || []; const idx = (id) => { const i = order.indexOf(id); return i === -1 ? 9999 : i; }; return [...dueToday].sort((a, b) => (idx(a.id) - idx(b.id)) || (a.createdAt || "").localeCompare(b.createdAt || "")); }, [dueToday, todayOrder]);
  const navItem = (k, label) => (
    <button key={k} onClick={() => { setView(k); setSearch(""); }} className="helm-nav" style={{ ...S.navItem, ...(view === k ? S.navItemActive : {}) }}>
      {label}
      {k === "review" && weekDone > 0 && <span style={{ ...S.navBadge, background: "#15A34A" }}>{weekDone}</span>}
    </button>
  );
  const calBase = active;
  const calTasks = storeFilter ? calBase.filter((t) => (t.stores || []).includes(storeFilter)) : calBase;


  const selectedTask = tasks.find((t) => t.id === selected) || null;

  if (!loaded) return (<div style={S.boot}><div style={S.bootMark}>Helm</div><div style={S.bootText}>Loading your command center…</div></div>);

  return (
    <div style={S.app}>
      <StyleTag />
      <aside className="helm-side" style={S.side}>
        <div style={S.brand}><div style={S.brandMark}>Helm <button onClick={() => setWhatsNew(true)} style={S.verChip} title="What's new">v{VERSION}</button></div><div style={S.brandSub}>What's on deck today</div></div>
        <div style={S.searchWrap}>
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search tasks…" style={S.searchInput} className="helm-input" />
          {search && <button onClick={() => setSearch("")} style={S.searchClear} title="Clear search">✕</button>}
        </div>
        <nav style={S.nav}>
          <div style={S.navSection}>Plan</div>
          {[["dashboard", "Dashboard"], ["today", "Today"], ["calendar", "Calendar"]].map(([k, label]) => navItem(k, label))}
          <div style={S.navSection}>Organize</div>
          {[["areas", "Areas"], ["table", "Table"]].map(([k, label]) => navItem(k, label))}
          <button onClick={() => setToolsOpen((o) => !o)} style={S.navSectionToggle} className="helm-navsec">
            <span>Tools</span>
            {!(toolsOpen || ["review", "annual"].includes(view)) && weekDone > 0 && <span style={{ ...S.navBadge, background: "#15A34A", marginLeft: 6 }}>{weekDone}</span>}
            <span style={{ marginLeft: "auto", fontSize: 11 }}>{toolsOpen || ["review", "annual"].includes(view) ? "▾" : "▸"}</span>
          </button>
          {(toolsOpen || ["review", "annual"].includes(view)) && [["review", "Review"], ["annual", "Annual Planning"]].map(([k, label]) => navItem(k, label))}
        </nav>
        <div style={{ ...S.sideBlock, ...(storeAware ? {} : { opacity: 0.42, pointerEvents: "none" }) }}>
          <div style={S.sideLabel}>Filter by store</div>
          <div style={S.storeWrap}>
            <button onClick={() => setStoreFilter(null)} style={{ ...S.storeChip, ...(storeFilter === null ? S.storeChipOn : {}) }}>All</button>
            {STORES.map((s) => <button key={s} onClick={() => setStoreFilter(storeFilter === s ? null : s)} style={{ ...S.storeChip, ...(storeFilter === s ? S.storeChipOn : {}) }}>{s}</button>)}
          </div>
          <div style={S.storeNote}>{storeAware ? "Filters Dashboard, Areas & Calendar" : "Not used on this tab"}</div>
        </div>
        <div style={S.sideBlock}>
          <div style={S.sideLabel}>Areas</div>
          {AREA_NAMES.map((a) => <div key={a} style={S.legendRow}><span style={{ ...S.dot, background: AREAS[a].color }} /> {a}</div>)}
        </div>
        <div style={S.sideBlock}>
          <div style={S.sideLabel}>Data</div>
          <div style={S.dataBtns}>
            <button onClick={backup} style={S.dataBtn} className="helm-mini">Back up</button>
            <button onClick={() => fileRef.current && fileRef.current.click()} style={S.dataBtn} className="helm-mini">Restore</button>
            <button onClick={exportCSV} style={S.dataBtn} className="helm-mini">Export CSV</button>
            <button onClick={() => setSnapModal(true)} style={S.dataBtn} className="helm-mini">Snapshots</button>
            <button onClick={downloadTemplate} style={S.dataBtn} className="helm-mini">Excel template</button>
            <button onClick={() => importRef.current && importRef.current.click()} style={S.dataBtn} className="helm-mini">Import</button>
            <button onClick={() => setConfirm({ title: "Clear ALL data?", message: "This wipes every task, template, and history entry so you can start completely fresh. A safety snapshot is saved first, and you can undo right after.", confirmLabel: "Clear everything", danger: true, onConfirm: clearAll })} style={{ ...S.dataBtn, color: "#DC2626", borderColor: "#F1D5D5" }} className="helm-mini">Clear all</button>
          </div>
          <div style={S.storeNote}>{lastBackup ? `Last backup: ${relDay(lastBackup)}` : "No download backup yet"}</div>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={handleRestore} />
          <input ref={importRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={handleImport} />
        </div>
        <button onClick={() => setConfirm({ title: "Reset to demo data?", message: "This replaces ALL your tasks, templates, and history with the sample data. A safety snapshot of your current data is saved first, so you can restore it from Snapshots.", confirmLabel: "Reset everything", danger: true, onConfirm: () => { pushSnapshot("before reset"); resetAll(); } })} style={S.reset} title="Replace everything with sample data (snapshot saved first)">Reset to demo</button>
        <button onClick={() => window.helmSignOut && window.helmSignOut()} style={{ marginTop: 10, border: "1px solid #E6E9EE", background: "#fff", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, fontWeight: 600, color: "#5B6472", cursor: "pointer", fontFamily: FONT, width: "100%" }} title="Sign out of Helm">Sign out</button>
      </aside>

      <main style={S.main}>{search.trim() ? <SearchView query={search} tasks={tasks} onOpen={setSelected} onComplete={complete} onReschedule={reschedule} onEmail={setEmailTask} /> : <>
        {view === "dashboard" && <Dashboard quick={quick} setQuick={setQuick} quickAdd={quickAdd} quickFeedback={quickFeedback} onQuickRename={updateField} onQuickHold={() => clearTimeout(qfTimer.current)} onQuickDismiss={() => { clearTimeout(qfTimer.current); setQuickFeedback(null); }} dueToday={dueToday} overdue={overdue} thisWeek={thisWeek} onOpen={setSelected} onComplete={complete} setView={setView} storeFilter={storeFilter} contextTasks={active} onAddSuggestion={addSuggestion} lastBackup={lastBackup} onBackup={backup} onReschedule={reschedule} onTriage={() => setTriage(overdue.slice())} onEmail={setEmailTask} onBrief={() => setBriefOpen(true)} totalTasks={tasks.filter((t) => !t.completed).length} />}
        {view === "today" && <TodayView tasks={todayList} overdue={overdue} onOpen={setSelected} onComplete={complete} onReschedule={reschedule} onEmail={setEmailTask} onReorder={setTodayOrder} onBulkComplete={bulkComplete} onBulkReschedule={bulkReschedule} onBulkDelete={bulkDelete} />}
        {view === "review" && <ReviewView log={completionLog} />}
        {view === "areas" && <AreasView tasks={visible} onOpen={setSelected} onComplete={complete} onReschedule={reschedule} onEmail={setEmailTask} onNew={(a, s) => upsert(mk({ area: a, subArea: s, dueDate: toISO(today()) }))} onBulkComplete={bulkComplete} onBulkReschedule={bulkReschedule} onBulkDelete={bulkDelete} />}
        {view === "calendar" && <CalendarView tasks={calTasks} mode={calMode} setMode={setCalMode} cursor={calCursor} setCursor={setCalCursor} onOpen={setSelected} />}
        {view === "table" && <TableView tasks={visible} onOpen={setSelected} onComplete={complete} onUpdate={updateField} />}
        {view === "annual" && <AnnualView tasks={tasks} onOpen={setSelected} />}
      </>}</main>

      {selectedTask && <TaskDrawer task={selectedTask} onClose={() => setSelected(null)} onSave={upsert} onDelete={remove} onDuplicate={duplicate} onSkip={skipOccurrence} onComplete={(id) => { const tk = tasks.find((x) => x.id === id); const ok = complete(id); if (!ok) return; const rolled = tk && tk.recurrence && tk.dueDate && !(tk.recurrence.until && fromISO(nextOccurrence(tk)) > fromISO(tk.recurrence.until)); if (!rolled) setSelected(null); }} />}



      {snapModal && <SnapshotsModal snapshots={snapshots} onClose={() => setSnapModal(false)} onRestore={restoreSnapshot} />}

      {confirm && <ConfirmModal data={confirm} onClose={() => setConfirm(null)} />}

      {triage && <TriageModal items={triage} onDone={forceComplete} onReschedule={reschedule} onDrop={remove} onClose={() => setTriage(null)} />}

      {emailTask && <EmailModal task={emailTask} onClose={() => setEmailTask(null)} onNotice={setNotice} />}

      {briefOpen && <BriefModal dueToday={dueToday} overdue={overdue} thisWeek={thisWeek} onClose={() => setBriefOpen(false)} onNotice={setNotice} />}
      {whatsNew && <WhatsNewModal onClose={dismissWhatsNew} />}

      {notice && (
        <div className="helm-notice" style={{ ...S.notice, ...(notice.type === "block" ? S.noticeBlock : S.noticeOk) }}>
          <span onClick={() => setNotice(null)} style={{ cursor: "pointer" }}>{notice.text}</span>
          {notice.action && <button onClick={() => { notice.action.onClick(); }} style={S.noticeAction}>{notice.action.label}</button>}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   VIEWS
   ============================================================ */

function Dashboard({ quick, setQuick, quickAdd, quickFeedback, onQuickRename, onQuickHold, onQuickDismiss, dueToday, overdue, thisWeek, onOpen, onComplete, setView, storeFilter, contextTasks, onAddSuggestion, lastBackup, onBackup, onReschedule, onTriage, onEmail, onBrief, totalTasks }) {
  const hour = new Date().getHours();
  const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const [bannerHidden, setBannerHidden] = useState(false);
  const [expanded, setExpanded] = useState({});
  const [undatedExpanded, setUndatedExpanded] = useState(false);
  const LIMIT = 15;
  const listCard = (key, list, rowProps) => {
    const shown = expanded[key] ? list : list.slice(0, LIMIT);
    return (
      <>
        {shown.map((t) => <TaskRow key={t.id} task={t} onOpen={onOpen} onComplete={onComplete} onReschedule={onReschedule} onEmail={onEmail} {...rowProps} />)}
        {list.length > LIMIT && <button onClick={() => setExpanded((e) => ({ ...e, [key]: !e[key] }))} style={S.moreLink}>{expanded[key] ? "Show fewer" : `Show all ${list.length}`}</button>}
      </>
    );
  };
  const daysSince = lastBackup ? diffDays(today(), fromISO(lastBackup)) : null;
  const undated = contextTasks.filter((t) => !t.completed && !t.dueDate);
  const backupStale = (daysSince === null || daysSince > 7) && !bannerHidden;
  return (
    <div className="helm-scroll" style={S.scroll}>
      {backupStale && (
        <div style={S.banner}>
          <span style={{ flex: 1 }}>{lastBackup ? `It's been ${daysSince} days since your last backup.` : "You haven't downloaded a backup yet — Helm keeps a daily in-app snapshot, but a downloaded copy is safest."}</span>
          <button onClick={onBackup} style={S.bannerBtn} className="helm-primary">Back up now</button>
          <button onClick={() => setBannerHidden(true)} style={S.bannerDismiss}>Later</button>
        </div>
      )}
      <header style={S.head}>
        <div style={S.todayHead}>
          <div>
            <div style={S.eyebrow}>{fmtLong(toISO(today()))}{storeFilter ? ` · ${storeFilter}` : ""}</div>
            <h1 style={S.h1}>{greet}, Kathleen.</h1>
            <div style={S.headStat}>
              {overdue.length > 0 && <span style={S.statOver}>{overdue.length} overdue</span>}
              <span>{dueToday.length} due today</span>
              <span style={S.statDim}>· {thisWeek.length} this week</span>
              {undated.length > 0 && <span onClick={() => setUndatedExpanded(true)} style={S.statUndated} title="Tasks with no due date — click to set dates">· {undated.length} undated</span>}
              <span style={S.statDim}>· {totalTasks} open total</span>
            </div>
          </div>
          <button onClick={onBrief} style={S.briefBtn} className="helm-mini">Morning brief</button>
        </div>
      </header>

      <div style={S.quickWrap}>
        <input value={quick} onChange={(e) => setQuick(e.target.value)} onKeyDown={(e) => e.key === "Enter" && quickAdd()} placeholder='Quick add — try "Review aging every Tuesday" or "commission report monthly on the last business day"' style={S.quickInput} className="helm-input" />
        <button onClick={quickAdd} style={S.quickBtn} className="helm-primary">Add</button>
      </div>
      {quickFeedback && (
        <div style={{ ...S.toast, gap: 10, flexWrap: "wrap" }}>
          <span style={{ ...S.dot, background: AREAS[quickFeedback.area].color, flexShrink: 0 }} />
          <input key={quickFeedback.id} defaultValue={quickFeedback.title} onFocus={onQuickHold} onChange={(e) => onQuickRename(quickFeedback.id, { title: e.target.value })} style={S.quickEditInput} className="helm-input" />
          {quickFeedback.note && <span style={S.quickEditNote}>{quickFeedback.note}</span>}
          <button onClick={() => onOpen(quickFeedback.id)} style={S.quickEditOpen} className="helm-mini">Edit details</button>
          <button onClick={onQuickDismiss} style={S.quickEditX} title="Dismiss">×</button>
        </div>
      )}

      <SuggestPanel contextTasks={contextTasks} onAdd={onAddSuggestion} />

      {undated.length > 0 && (
        <div style={S.undatedBanner}>
          <div style={S.undatedTop}>
            <span style={S.undatedIcon}>!</span>
            <span style={{ flex: 1 }}><strong>{undated.length} task{undated.length === 1 ? "" : "s"}</strong> {undated.length === 1 ? "has" : "have"} no due date, so {undated.length === 1 ? "it won't" : "they won't"} show up on your Dashboard, Today, or Calendar until dated.</span>
            <button onClick={() => setUndatedExpanded((v) => !v)} style={S.undatedToggle} className="helm-mini">{undatedExpanded ? "Hide" : "Set dates"}</button>
          </div>
          {undatedExpanded && (
            <div style={S.undatedList}>
              {undated.map((t) => (
                <div key={t.id} style={S.undatedRow}>
                  <span style={{ ...S.dot, background: AREAS[t.area].color }} />
                  <span style={S.undatedTitle} onClick={() => onOpen(t.id)}>{t.title}</span>
                  <span style={S.undatedArea}>{t.subArea || t.area}</span>
                  <input type="date" onChange={(e) => e.target.value && onReschedule(t.id, e.target.value)} style={S.undatedDate} className="helm-input" />
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={S.grid}>
        <Panel title="Due Today" count={dueToday.length} accent="#14181F">
          {dueToday.length === 0 ? <Empty text="Nothing due today. Steer where you like." /> : listCard("today", dueToday, { showFullDate: true })}
        </Panel>
        <Panel title="Due This Week" count={thisWeek.length} accent="#14181F" onTitle={() => setView("calendar")}>
          {thisWeek.length === 0 ? <Empty text="The week is wide open." /> : listCard("week", thisWeek, { showFullDate: true })}
          {thisWeek.length > 0 && <button onClick={() => setView("calendar")} style={S.moreLink}>Open in Calendar →</button>}
        </Panel>
        <Panel title="Overdue" count={overdue.length} accent="#DC2626">
          {overdue.length === 0 ? <Empty text="Clean slate. No overdue items." /> : (
            <>
              {overdue.length >= 3 && <button onClick={onTriage} style={S.triageLink} className="helm-primary">Clean up overdue ({overdue.length}) →</button>}
              {listCard("overdue", overdue, { overdue: true })}
            </>
          )}
        </Panel>
      </div>
    </div>
  );
}

function Panel({ title, count, accent, children, onTitle, wide }) {
  const [collapsed, setCollapsed] = useState(false);
  return (
    <section style={{ ...S.panel, ...(wide ? S.panelWide : {}) }}>
      <div style={{ ...S.panelHead, ...(collapsed ? { marginBottom: 0 } : {}) }} onClick={() => setCollapsed((c) => !c)} className="helm-clickhead">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#5B6472" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, transition: "transform .15s ease", transform: collapsed ? "rotate(-90deg)" : "rotate(0deg)" }}><path d="m6 9 6 6 6-6" /></svg>
        <span style={{ ...S.panelDot, background: accent }} /><h2 style={S.panelTitle}>{title}</h2><span style={S.panelCount}>{count}</span>
        {onTitle && <button onClick={(e) => { e.stopPropagation(); onTitle(); }} style={S.panelGo} title="Open full view">→</button>}
      </div>
      {!collapsed && <div>{children}</div>}
    </section>
  );
}

function TaskRow({ task, onOpen, onComplete, onReschedule, onEmail, overdue, showDate, showFullDate, selectable, selected, onToggleSelect }) {
  const a = AREAS[task.area];
  const doneCount = task.subtasks.filter((s) => s.done).length;
  const hasOpenSubs = task.subtasks.length > 0 && doneCount < task.subtasks.length;
  const meta = (
    <div style={S.rowMeta}>
      <span style={{ ...S.areaTag, color: a.color, background: a.soft }}>{task.subArea || task.area}</span>
      {task.recurrence && <span style={S.metaDim}>↻ {recurLabel(task.recurrence)}</span>}
      {task.recurrence && task.lastCompleted && <span style={S.metaDim}>· last done {fmtShort(task.lastCompleted)}</span>}
      {task.subtasks.length > 0 && <span style={{ ...S.metaDim, ...(hasOpenSubs ? {} : { color: a.color }) }}>{doneCount}/{task.subtasks.length}</span>}
      {task.stores.map((s) => <span key={s} style={S.storeTag}>{s}</span>)}
      {showFullDate && task.dueDate && <span style={S.metaDate}>{fmtLongY(task.dueDate)}</span>}
      {showDate && !showFullDate && task.dueDate && <span style={S.metaDim}>{relDay(task.dueDate)}</span>}
      {overdue && task.dueDate && <span style={S.overTag}>{fmtShort(task.dueDate)} · {relDay(task.dueDate)}</span>}
    </div>
  );
  if (selectable) {
    return (
      <div className="helm-rowhover" style={{ ...S.row, cursor: "pointer", ...(selected ? { background: "#EEF2FF" } : {}) }} onClick={() => onToggleSelect(task.id)}>
        <button style={{ ...S.check, borderColor: selected ? a.color : "#CBD0D9", background: selected ? a.color : "#fff", color: "#fff" }} className="helm-check">{selected ? "✓" : ""}</button>
        <div style={{ flex: 1 }}><div style={S.rowTitle}>{task.title}</div>{meta}</div>
      </div>
    );
  }
  return (
    <div className="helm-rowhover" style={S.row}>
      <button onClick={(e) => { e.stopPropagation(); onComplete(task.id); }} style={{ ...S.check, borderColor: a.color }} className="helm-check" title={hasOpenSubs ? "Finish the checklist first" : "Complete"}>{task.recurrence ? <span style={{ ...S.recurDot, background: a.color }} /> : null}</button>
      <div style={{ flex: 1, cursor: "pointer" }} onClick={() => onOpen(task.id)}>
        <div style={S.rowTitle}>{task.title}</div>
        {meta}
      </div>
      <div style={S.rowActions}>
        {onEmail && !task.completed && <button className="helm-snooze" style={S.snoozeBtn} title="Draft an email from this task" onClick={(e) => { e.stopPropagation(); onEmail(task); }}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg></button>}
        {onReschedule && !task.completed && <RowSnooze task={task} onReschedule={onReschedule} />}
      </div>
    </div>
  );
}

function Empty({ text }) { return <div style={S.empty}>{text}</div>; }

/* ---- Areas ---- */
function AreasView({ tasks, onOpen, onComplete, onReschedule, onEmail, onNew, onBulkComplete, onBulkReschedule, onBulkDelete }) {
  const [selMode, setSelMode] = useState(false);
  const [selected, setSelected] = useState([]);
  const [picking, setPicking] = useState(false);
  const toggleSel = (id) => setSelected((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);
  const clearSel = () => { setSelected([]); setSelMode(false); setPicking(false); };
  return (
    <div className="helm-scroll" style={S.scroll}>
      <header style={S.head}>
        <div style={S.todayHead}>
          <div><h1 style={S.h1}>Areas</h1><div style={S.subhead}>Your day jumps between functions. Browse by what, not by when.</div></div>
          <button onClick={() => selMode ? clearSel() : setSelMode(true)} style={S.selectToggle} className="helm-mini">{selMode ? "Cancel" : "Select"}</button>
        </div>
      </header>
      <div style={S.areaGrid}>
        {AREA_NAMES.map((area) => {
          const a = AREAS[area];
          const list = tasks.filter((t) => t.area === area && !t.completed);
          return (
            <section key={area} style={{ ...S.areaCard, borderTop: `3px solid ${a.color}` }}>
              <div style={S.areaCardHead}><h2 style={S.areaCardTitle}><span style={{ ...S.dot, background: a.color }} /> {area}</h2>{!selMode && <button onClick={() => onNew(area, null)} style={S.addMini} className="helm-mini">+ Add</button>}</div>
              {a.subs.length > 0 && <div style={S.subRow}>{a.subs.map((s) => { const n = list.filter((t) => t.subArea === s).length; return <span key={s} style={S.subPill}>{s}{n ? ` ${n}` : ""}</span>; })}</div>}
              {list.length === 0 ? <Empty text="No open items here." /> : list.sort((x, y) => (x.dueDate || "9").localeCompare(y.dueDate || "9")).map((t) => <TaskRow key={t.id} task={t} onOpen={onOpen} onComplete={onComplete} onReschedule={onReschedule} onEmail={onEmail} selectable={selMode} selected={selected.includes(t.id)} onToggleSelect={toggleSel} showFullDate />)}
            </section>
          );
        })}
      </div>
      {selMode && selected.length > 0 && (
        <div style={S.bulkBar}>
          <span style={S.bulkCount}>{selected.length} selected</span>
          <button style={S.bulkBtn} className="helm-mini" onClick={() => { onBulkComplete(selected); clearSel(); }}>Complete</button>
          <button style={S.bulkBtn} className="helm-mini" onClick={() => { onBulkReschedule(selected, toISO(addDays(today(), 1))); clearSel(); }}>Tomorrow</button>
          <button style={S.bulkBtn} className="helm-mini" onClick={() => { onBulkReschedule(selected, toISO(addDays(today(), 7))); clearSel(); }}>Next week</button>
          {!picking ? <button style={S.bulkBtn} className="helm-mini" onClick={() => setPicking(true)}>Pick date…</button>
            : <input type="date" autoFocus style={{ ...S.input, width: 150 }} className="helm-input" onChange={(e) => { if (e.target.value) { onBulkReschedule(selected, e.target.value); clearSel(); } }} />}
          <button style={S.bulkDelete} className="helm-delete" onClick={() => { onBulkDelete(selected); clearSel(); }}>Delete</button>
        </div>
      )}
    </div>
  );
}

/* ---- Calendar ---- */
function CalendarView({ tasks, mode, setMode, cursor, setCursor, onOpen }) {
  const cur = fromISO(cursor);
  const byDate = useMemo(() => { const m = {}; tasks.forEach((t) => { if (t.dueDate && !t.completed) (m[t.dueDate] = m[t.dueDate] || []).push(t); }); return m; }, [tasks]);
  const shift = (n) => { if (mode === "month") setCursor(toISO(addMonths(cur, n))); else if (mode === "week") setCursor(toISO(addDays(cur, n * 7))); else setCursor(toISO(addDays(cur, n))); };
  let label = `${MONTHS[cur.getMonth()]} ${cur.getFullYear()}`;
  if (mode === "week") { const start = addDays(cur, -cur.getDay()); const end = addDays(start, 6); label = `${MONTHS_SHORT[start.getMonth()]} ${start.getDate()} – ${MONTHS_SHORT[end.getMonth()]} ${end.getDate()}`; }
  if (mode === "agenda") label = "Upcoming";
  return (
    <div className="helm-scroll" style={S.scroll}>
      <header style={S.head}>
        <h1 style={S.h1}>Calendar</h1>
        <div style={S.calBar}>
          <div style={S.calModes}>{["agenda", "week", "month"].map((m) => <button key={m} onClick={() => setMode(m)} style={{ ...S.calModeBtn, ...(mode === m ? S.calModeOn : {}) }}>{m[0].toUpperCase() + m.slice(1)}</button>)}</div>
          {mode !== "agenda" && (<div style={S.calNav}><button onClick={() => shift(-1)} style={S.navArrow}>‹</button><span style={S.calLabel}>{label}</span><button onClick={() => shift(1)} style={S.navArrow}>›</button><button onClick={() => setCursor(toISO(today()))} style={S.todayBtn}>Today</button></div>)}
        </div>
      </header>
      {mode === "month" && <MonthGrid cur={cur} byDate={byDate} onOpen={onOpen} />}
      {mode === "week" && <WeekGrid cur={cur} byDate={byDate} onOpen={onOpen} />}
      {mode === "agenda" && <Agenda tasks={tasks} onOpen={onOpen} />}
    </div>
  );
}

function MonthGrid({ cur, byDate, onOpen }) {
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const start = addDays(first, -first.getDay());
  const cells = Array.from({ length: 42 }, (_, i) => addDays(start, i));
  return (
    <div style={S.monthWrap}>
      <div style={S.weekHead}>{WEEKDAYS_SHORT.map((d) => <div key={d} style={S.weekHeadCell}>{d}</div>)}</div>
      <div style={S.monthGrid}>
        {cells.map((d, i) => {
          const iso = toISO(d); const items = byDate[iso] || []; const isThis = d.getMonth() === cur.getMonth(); const isToday = diffDays(d, today()) === 0;
          return (
            <div key={i} style={{ ...S.dayCell, ...(isThis ? {} : S.dayOut), ...(isToday ? S.dayToday : {}) }}>
              <div style={{ ...S.dayNum, ...(isToday ? S.dayNumToday : {}) }}>{d.getDate()}</div>
              {items.slice(0, 4).map((t) => <div key={t.id} onClick={() => onOpen(t.id)} className="helm-rowhover" style={{ ...S.calItem, borderLeft: `3px solid ${AREAS[t.area].color}` }}>{t.title}</div>)}
              {items.length > 4 && <div style={S.calMore}>+{items.length - 4}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function WeekGrid({ cur, byDate, onOpen }) {
  const start = addDays(cur, -cur.getDay());
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  return (
    <div style={S.weekWrap}>
      {days.map((d, i) => {
        const iso = toISO(d); const items = byDate[iso] || []; const isToday = diffDays(d, today()) === 0;
        return (
          <div key={i} style={{ ...S.weekCol, ...(isToday ? S.weekColToday : {}) }}>
            <div style={S.weekColHead}>{WEEKDAYS_SHORT[d.getDay()]} <span style={S.weekColNum}>{d.getDate()}</span></div>
            {items.length === 0 ? <div style={S.weekColEmpty}>—</div> : items.map((t) => <div key={t.id} onClick={() => onOpen(t.id)} className="helm-rowhover" style={{ ...S.calItem, borderLeft: `3px solid ${AREAS[t.area].color}` }}>{t.title}</div>)}
          </div>
        );
      })}
    </div>
  );
}

function Agenda({ tasks, onOpen }) {
  const upcoming = tasks.filter((t) => t.dueDate && !t.completed && fromISO(t.dueDate) >= today()).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const groups = {}; upcoming.forEach((t) => { (groups[t.dueDate] = groups[t.dueDate] || []).push(t); });
  const dates = Object.keys(groups).sort();
  if (dates.length === 0) return <Empty text="Nothing scheduled ahead." />;
  return (
    <div style={S.agenda}>
      {dates.map((iso) => (
        <div key={iso} style={S.agendaGroup}>
          <div style={S.agendaDate}>{fmtLong(iso)} <span style={S.agendaRel}>{relDay(iso)}</span></div>
          {groups[iso].map((t) => <div key={t.id} onClick={() => onOpen(t.id)} className="helm-rowhover" style={S.agendaItem}><span style={{ ...S.dot, background: AREAS[t.area].color }} /><span style={{ flex: 1 }}>{t.title}</span><span style={{ ...S.areaTag, color: AREAS[t.area].color, background: AREAS[t.area].soft }}>{t.subArea || t.area}</span></div>)}
        </div>
      ))}
    </div>
  );
}

/* ---- Review (completed) ---- */
function ReviewView({ log }) {
  const [recapOpen, setRecapOpen] = useState(false);
  const cutoff = addDays(today(), -6);
  const recent = log.filter((e) => startOfDay(new Date(e.completedAt)) >= cutoff).sort((a, b) => b.completedAt.localeCompare(a.completedAt));
  const byArea = {}; recent.forEach((e) => { byArea[e.area] = (byArea[e.area] || 0) + 1; });
  const areaRows = Object.entries(byArea).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...areaRows.map(([, n]) => n));
  const groups = {}; recent.forEach((e) => { const k = toISO(new Date(e.completedAt)); (groups[k] = groups[k] || []).push(e); });
  const days = Object.keys(groups).sort().reverse();
  const recapText = (() => {
    const L = [];
    L.push(`Weekly recap — week ending ${fmtLong(toISO(today()))}`, "");
    L.push(`Completed: ${recent.length} task${recent.length === 1 ? "" : "s"}`, "");
    if (areaRows.length) { L.push("By area:"); areaRows.forEach(([area, n]) => L.push(`- ${area}: ${n}`)); L.push(""); }
    L.push("Detail:");
    days.forEach((iso) => { L.push(fmtLong(iso)); groups[iso].forEach((e) => L.push(`  - ${e.title} [${e.area}]`)); });
    return L.join("\n");
  })();
  return (
    <div className="helm-scroll" style={S.scroll}>
      <header style={S.head}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <div>
            <h1 style={S.h1}>Review</h1>
            <div style={S.subhead}>Everything you closed in the last 7 days — recurring runs included. Proof the week wasn't a blur.</div>
          </div>
          {recent.length > 0 && <button onClick={() => setRecapOpen(true)} style={S.briefBtn} className="helm-mini">Copy weekly recap</button>}
        </div>
      </header>
      {recapOpen && <RecapModal text={recapText} onClose={() => setRecapOpen(false)} />}
      {recent.length === 0 ? <Empty text="Nothing logged in the last 7 days yet. Go check a box." /> : (
        <>
          <div style={S.reviewTop}>
            <div style={S.reviewBig}><span style={S.reviewNum}>{recent.length}</span><span style={S.reviewBigLabel}>tasks completed</span></div>
            <div style={S.reviewBars}>
              {areaRows.map(([area, n]) => (
                <div key={area} style={S.barRow}>
                  <span style={S.barLabel}>{area}</span>
                  <div style={S.barTrack}><div style={{ ...S.barFill, width: `${(n / max) * 100}%`, background: AREAS[area] ? AREAS[area].color : "#9AA1AC" }} /></div>
                  <span style={S.barNum}>{n}</span>
                </div>
              ))}
            </div>
          </div>
          <div style={S.reviewList}>
            {days.map((iso) => (
              <div key={iso} style={S.agendaGroup}>
                <div style={S.agendaDate}>{relDay(iso)} <span style={S.agendaRel}>{fmtLong(iso)}</span></div>
                {groups[iso].map((e) => (
                  <div key={e.id} style={S.doneItem}>
                    <span style={{ ...S.doneCheck, borderColor: AREAS[e.area] ? AREAS[e.area].color : "#9AA1AC", color: AREAS[e.area] ? AREAS[e.area].color : "#9AA1AC" }}>✓</span>
                    <span style={{ flex: 1, color: "#3A424E" }}>{e.title}</span>
                    <span style={{ ...S.areaTag, color: AREAS[e.area] ? AREAS[e.area].color : "#5B6472", background: AREAS[e.area] ? AREAS[e.area].soft : "#EEF0F4" }}>{e.area}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ---- Annual heat map ---- */
function AnnualView({ tasks, onOpen }) {
  const year = today().getFullYear();
  const months = useMemo(() => {
    const buckets = Array.from({ length: 12 }, () => []);
    tasks.forEach((t) => { const dateStr = t.dueDate; if (!dateStr || t.completed) return; const d = fromISO(dateStr); if (d.getFullYear() === year) buckets[d.getMonth()].push(t); });
    return buckets;
  }, [tasks, year]);
  const max = Math.max(1, ...months.map((m) => m.length));
  return (
    <div className="helm-scroll" style={S.scroll}>
      <header style={S.head}><h1 style={S.h1}>Annual Planning · {year}</h1><div style={S.subhead}>A heat map of your year. Darker months are heavier — plan your air around them.</div></header>
      <div style={S.ribbon}>
        {months.map((m, i) => { const intensity = m.length / max; const bg = `rgba(124, 58, 237, ${0.08 + intensity * 0.62})`; return <div key={i} style={{ ...S.ribbonCell, background: m.length ? bg : "#F1F2F5" }}><span style={{ ...S.ribbonMonth, color: intensity > 0.5 ? "#fff" : "#5B6472" }}>{MONTHS_SHORT[i]}</span><span style={{ ...S.ribbonNum, color: intensity > 0.5 ? "#fff" : "#14181F" }}>{m.length || ""}</span></div>; })}
      </div>
      <div style={S.annualGrid}>
        {months.map((m, i) => (
          <section key={i} style={S.annualCard}>
            <div style={S.annualMonth}>{MONTHS[i]} <span style={S.annualCount}>{m.length}</span></div>
            {m.length === 0 ? <div style={S.annualEmpty}>Open</div> : m.sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || "")).map((t) => (
              <div key={t.id} onClick={() => onOpen(t.id)} className="helm-rowhover" style={S.annualItem}>
                <span style={{ ...S.dot, background: AREAS[t.area].color }} /><span style={{ flex: 1 }}>{t.title}</span>
              </div>
            ))}
          </section>
        ))}
      </div>
    </div>
  );
}

/* ---- Task drawer ---- */
function Chevron({ open }) {
  return <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#9AA1AC" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ marginLeft: "auto", flexShrink: 0, transition: "transform .15s ease", transform: open ? "rotate(0deg)" : "rotate(-90deg)" }}><path d="m6 9 6 6 6-6" /></svg>;
}

function SecIcon({ kind, color }) {
  const p = { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style: { flexShrink: 0 } };
  if (kind === "pin") return (<svg {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>);
  if (kind === "cal") return (<svg {...p}><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg>);
  if (kind === "check") return (<svg {...p}><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8M13 12h8M13 18h8" /></svg>);
  if (kind === "link") return (<svg {...p}><path d="M9 17H7A5 5 0 0 1 7 7h2" /><path d="M15 7h2a5 5 0 0 1 0 10h-2" /><path d="M8 12h8" /></svg>);
  if (kind === "note") return (<svg {...p}><path d="M4 4h16v12l-4 4H4z" /><path d="M16 20v-4h4" /><path d="M8 9h8M8 13h5" /></svg>);
  return null;
}

function TaskDrawer({ task, onClose, onSave, onDelete, onDuplicate, onSkip, onComplete }) {
  const [t, setT] = useState(task);
  const [newSub, setNewSub] = useState("");
  const [newLink, setNewLink] = useState({ label: "", url: "" });
  const [aiBusy, setAiBusy] = useState(false);
  const [aiErr, setAiErr] = useState(false);
  const [secOpen, setSecOpen] = useState(() => { const up = !!(task.dueDate || task.recurrence); return { details: !up, schedule: !up }; });
  useEffect(() => { setT(task); const up = !!(task.dueDate || task.recurrence); setSecOpen({ details: !up, schedule: !up }); }, [task.id]);
  useEffect(() => { setT(task); }, [task.dueDate, task.lastCompleted, task.completed]);
  const set = (patch) => { const nt = { ...t, ...patch }; setT(nt); onSave(nt); };
  const a = AREAS[t.area];
  const isMQ = t.recurrence && (t.recurrence.frequency === "monthly" || t.recurrence.frequency === "quarterly");
  const suggestSteps = async () => {
    if (aiBusy) return;
    setAiBusy(true); setAiErr(false);
    try {
      const steps = await aiJSON(`Break this work task into a short, practical checklist. Task: "${t.title || "Untitled task"}". Area: ${t.area}. Return ONLY a JSON array of 4-7 short imperative step strings, no numbering.`, 500);
      if (Array.isArray(steps) && steps.length) set({ subtasks: [...t.subtasks, ...steps.filter((x) => typeof x === "string").map((x) => ({ id: uid(), text: x, done: false }))] });
      else setAiErr(true);
    } catch (e) { setAiErr(true); }
    setAiBusy(false);
  };
  const openSubs = t.subtasks.filter((s) => !s.done).length;
  const blocked = t.subtasks.length > 0 && openSubs > 0;

  return (
    <div className="helm-detail">
      <div style={S.detailInner} className="helm-drawer">
        <div style={{ ...S.drawerBar, background: a.color }} />
        <div style={S.drawerTop}>
          <button onClick={() => onComplete(t.id)} style={{ ...S.drawerCheck, borderColor: a.color, ...(blocked ? { opacity: 0.45 } : {}) }} className="helm-check" title={blocked ? `Finish the checklist first (${openSubs} left)` : "Complete"}>{t.completed ? "✓" : ""}</button>
          <input value={t.title} onChange={(e) => set({ title: e.target.value })} style={S.drawerTitle} className="helm-titleinput" placeholder="Task title" />
          <button onClick={onClose} style={S.closeBtn}>✕</button>
        </div>
        <div style={S.drawerScroll} className="helm-scroll">
          {(() => { const due = t.dueDate; const od = due && fromISO(due) < today() && !t.completed; return (
            <div style={S.dueLine}>
              <SecIcon kind="cal" color={od ? "#DC2626" : "#8A92A0"} />

            <select value={t.recurrence ? t.recurrence.frequency : ""} onChange={(e) => { const f = e.target.value; if (!f) return set({ recurrence: null }); set({ recurrence: { frequency: f, weekday: f === "weekly" ? (t.recurrence?.weekday ?? today().getDay()) : null, behavior: t.recurrence?.behavior || "must", anchor: (f === "monthly" || f === "quarterly") ? (t.recurrence?.anchor || "date") : undefined, until: t.recurrence?.until || null, interval: t.recurrence?.interval || 1 }, dueDate: t.dueDate || toISO(today()) }); }} style={S.input}>

            </select>

            {isMQ && <select value={t.recurrence.anchor || "date"} onChange={(e) => { const anchor = e.target.value; if (anchor === "fbd") set({ recurrence: { ...t.recurrence, anchor }, dueDate: toISO(nextFirstBusinessDay(today())) }); else if (anchor === "lbd") set({ recurrence: { ...t.recurrence, anchor }, dueDate: toISO(nextLastBusinessDay(today())) }); else set({ recurrence: { ...t.recurrence, anchor } }); }} style={S.input}><option value="date">{t.recurrence.frequency === "monthly" ? "Same day each month" : "Same day each quarter"}</option><option value="fbd">First business day of the month</option><option value="lbd">Last business day of the month</option></select>}

                <input type="number" min="1" value={t.recurrence.interval || 1} onChange={(e) => set({ recurrence: { ...t.recurrence, interval: Math.max(1, parseInt(e.target.value, 10) || 1) } })} style={{ ...S.input, width: 84 }} className="helm-input" />
                <span style={{ fontSize: 14, color: "#3A424E", fontWeight: 500 }}>{unitLabel(t.recurrence)}{t.recurrence.frequency === "weekly" && t.recurrence.weekday != null ? ` on ${WEEKDAYS[t.recurrence.weekday]}` : ""}</span>

              {t.lastCompleted && <div style={S.caption}>Last marked done {fmtLong(t.lastCompleted)}. Notes and checklist carry forward; checklist items reset to unchecked each time.</div>}
              <label style={S.fieldLabel}>If missed</label>
              <select value={t.recurrence.behavior} onChange={(e) => set({ recurrence: { ...t.recurrence, behavior: e.target.value } })} style={S.input}>{Object.entries(BEHAVIORS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
              <label style={S.fieldLabel}>Ends</label>
              <input type="date" value={t.recurrence.until || ""} onChange={(e) => set({ recurrence: { ...t.recurrence, until: e.target.value || null } })} style={S.input} className="helm-input" />
              <div style={S.caption}>{t.recurrence.until ? `Stops repeating after ${fmtLong(t.recurrence.until)}.` : "No end date — repeats indefinitely."}</div>

              {t.dueDate && <button onClick={() => onSkip(t.id)} style={S.skipBtn} className="helm-mini">Skip this occurrence → next up {relDay(nextOccurrence(t))}</button>}
            </>
          )}


            </>)}
          </div>
          <div style={S.secCard}>
            <div style={S.secHead}><SecIcon kind="check" color={a.color} /><span style={S.secTitle}>Checklist</span></div>
          <label style={S.fieldLabel}>Checklist {t.subtasks.length > 0 && <span style={{ color: blocked ? "#9AA1AC" : a.color, fontWeight: 700 }}>· {t.subtasks.length - openSubs}/{t.subtasks.length}</span>}</label>
          {t.subtasks.map((s) => (
            <div key={s.id} style={S.subItem}>
              <button onClick={() => set({ subtasks: t.subtasks.map((x) => x.id === s.id ? { ...x, done: !x.done } : x) })} style={{ ...S.subCheck, ...(s.done ? { background: a.color, borderColor: a.color } : {}) }} className="helm-check">{s.done ? "✓" : ""}</button>
              <span style={{ flex: 1, textDecoration: s.done ? "line-through" : "none", color: s.done ? "#9AA1AC" : "#14181F" }}>{s.text}</span>
              <button onClick={() => set({ subtasks: t.subtasks.filter((x) => x.id !== s.id) })} style={S.miniDel}>✕</button>
            </div>
          ))}
          <div style={S.subAddRow}>
            <input value={newSub} onChange={(e) => setNewSub(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && newSub.trim()) { set({ subtasks: [...t.subtasks, { id: uid(), text: newSub.trim(), done: false }] }); setNewSub(""); } }} placeholder="Add a step + Enter" style={{ ...S.input, flex: 1 }} className="helm-input" />
            <button onClick={suggestSteps} disabled={aiBusy} style={S.sparkleBtn} className="helm-mini" title="Draft a checklist with AI">{aiBusy ? "…" : "✦ Suggest"}</button>

          <label style={S.fieldLabel}>Links</label>
          {t.links.map((l, i) => (
            <div key={i} style={S.linkItem}><span style={S.linkIcon}>🔗</span>{l.url ? <a href={l.url} target="_blank" rel="noreferrer" style={S.linkA}>{l.label || l.url}</a> : <span style={{ flex: 1, color: "#5B6472" }}>{l.label} <em style={{ color: "#B4BAC3" }}>(no URL yet)</em></span>}<button onClick={() => set({ links: t.links.filter((_, j) => j !== i) })} style={S.miniDel}>✕</button></div>
          ))}
          <div style={S.linkAdd}>
            <input value={newLink.label} onChange={(e) => setNewLink({ ...newLink, label: e.target.value })} placeholder="Label" style={{ ...S.input, flex: 1 }} className="helm-input" />
            <input value={newLink.url} onChange={(e) => setNewLink({ ...newLink, url: e.target.value })} placeholder="https:// or OneNote link" style={{ ...S.input, flex: 1.4 }} className="helm-input" />
            <button onClick={() => { if (newLink.label || newLink.url) { set({ links: [...t.links, newLink] }); setNewLink({ label: "", url: "" }); } }} style={S.addMini} className="helm-mini">Add</button>
          </div>

          </div>
          <div style={S.secCard}>
            <div style={S.secHead}><SecIcon kind="note" color={a.color} /><span style={S.secTitle}>Notes</span></div>
          <label style={S.fieldLabel}>Notes</label>
          <textarea value={t.notes} onChange={(e) => set({ notes: e.target.value })} placeholder="Context, reminders, anything Future You will thank you for." style={S.textarea} className="helm-input" />

          </div>
          <div style={S.drawerFooter}>
            <button onClick={() => onDuplicate(t.id)} style={S.dupBtn} className="helm-mini">Duplicate task</button>

          </div>
        </div>
      </div>
    </div>
  );
}

/* ---- AI suggestions + snapshots ---- */
function SuggestPanel({ contextTasks, onAdd }) {
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [items, setItems] = useState([]);
  const [err, setErr] = useState(false);
  const [added, setAdded] = useState({});
  const run = async () => {
    setBusy(true); setErr(false);
    try {
      const titles = (contextTasks || []).slice(0, 40).map((t) => t.title).join(", ");
      const prompt = `You help an operations/HR/accounting leader at a multi-location HVAC/R wholesale distribution company plan recurring and seasonal work. Today is ${fmtLong(toISO(today()))}. Their areas: ${AREA_NAMES.join(", ")}. Tasks they already track: ${titles || "(none yet)"}. Suggest 5 recurring or seasonal tasks they likely SHOULD track but are probably MISSING, fitting this industry and this time of year. Do not duplicate existing ones. Return ONLY a JSON array of objects: {"title": string, "area": one of [${AREA_NAMES.join(", ")}], "cadence": short natural phrase like "every Tuesday" or "monthly on the first business day" or "quarterly" or "every year", "why": one short sentence}.`;
      const res = await aiJSON(prompt, 900);
      setItems(Array.isArray(res) ? res.slice(0, 6) : []);
    } catch (e) { setErr(true); }
    setBusy(false);
  };
  const toggle = () => { const next = !open; setOpen(next); if (next && items.length === 0 && !busy) run(); };
  return (
    <div style={S.suggestWrap}>
      <button onClick={toggle} style={S.suggestTrigger} className="helm-mini">✦ Suggest tasks {open ? "▴" : "▾"}</button>
      {open && (
        <div style={S.suggestBody}>
          {busy && <div style={S.suggestLoading}>Thinking through your year…</div>}
          {err && <div style={S.suggestLoading}>Couldn't reach the suggestion engine right now. <button onClick={run} style={S.linkBtn}>Try again</button></div>}
          {!busy && !err && items.length === 0 && <div style={S.suggestLoading}>No suggestions came back. <button onClick={run} style={S.linkBtn}>Try again</button></div>}
          {items.map((it, i) => {
            const area = AREA_NAMES.includes(it.area) ? it.area : "Other";
            return (
              <div key={i} style={S.suggestCard}>
                <span style={{ ...S.dot, background: AREAS[area].color, marginTop: 6 }} />
                <div style={{ flex: 1 }}>
                  <div style={S.suggestTitle}>{it.title} <span style={S.suggestCadence}>{it.cadence}</span></div>
                  {it.why && <div style={S.suggestWhy}>{it.why}</div>}
                </div>
                <button disabled={added[i]} onClick={() => { onAdd({ ...it, area }); setAdded((a) => ({ ...a, [i]: true })); }} style={{ ...S.suggestAdd, ...(added[i] ? { opacity: 0.5 } : {}) }} className="helm-mini">{added[i] ? "Added" : "Add"}</button>
              </div>
            );
          })}
          {items.length > 0 && <button onClick={run} style={S.linkBtn}>Regenerate</button>}
        </div>
      )}
    </div>
  );
}
