function TodayView({ tasks, overdue, onOpen, onComplete, onReschedule, onEmail, onReorder, onBulkComplete, onBulkReschedule, onBulkDelete }) {
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  const [selMode, setSelMode] = useState(false);
  const [selected, setSelected] = useState([]);
  const [picking, setPicking] = useState(false);
  const ids = tasks.map((t) => t.id);
  const toggleSel = (id) => setSelected((sx) => sx.includes(id) ? sx.filter((x) => x !== id) : [...sx, id]);
  const clearSel = () => { setSelected([]); setSelMode(false); setPicking(false); };
  const handleDrop = (targetId) => {
    if (dragId && dragId !== targetId) { const cur = ids.filter((x) => x !== dragId); const ti = cur.indexOf(targetId); cur.splice(ti, 0, dragId); onReorder(cur); }
    setDragId(null); setOverId(null);
  };
  return (
    <div className="helm-scroll" style={S.scroll}>
      <header style={S.head}>
        <div style={S.todayHead}>
          <div><div style={S.eyebrow}>{fmtLong(toISO(today()))}</div><h1 style={S.h1}>Today</h1></div>
          <button onClick={() => selMode ? clearSel() : setSelMode(true)} style={S.selectToggle} className="helm-mini">{selMode ? "Cancel" : "Select"}</button>
        </div>
        <div style={S.subhead}>Just today's work. Drag to set your order, or Select several to act on at once.</div>
      </header>

      <section style={{ ...S.panel, marginBottom: 16 }}>
        <div style={S.panelHead}><span style={{ ...S.panelDot, background: "#14181F" }} /><h2 style={S.panelTitle}>Due Today</h2><span style={S.panelCount}>{tasks.length}</span></div>
        {tasks.length === 0 ? <Empty text="Nothing due today. Enjoy the rare quiet." /> : tasks.map((t) => (
          <div key={t.id} draggable={!selMode} onDragStart={() => setDragId(t.id)} onDragOver={(e) => { e.preventDefault(); setOverId(t.id); }} onDragEnd={() => { setDragId(null); setOverId(null); }} onDrop={() => handleDrop(t.id)} style={{ borderRadius: 8, ...(overId === t.id && dragId && dragId !== t.id ? S.dropTarget : {}), ...(dragId === t.id ? { opacity: 0.4 } : {}) }}>
            <div style={{ display: "flex", alignItems: "center" }}>
              {!selMode && <span style={S.grip} title="Drag to reorder">⠿</span>}
              <div style={{ flex: 1, minWidth: 0 }}>
                <TaskRow task={t} onOpen={onOpen} onComplete={onComplete} onReschedule={onReschedule} onEmail={onEmail} selectable={selMode} selected={selected.includes(t.id)} onToggleSelect={toggleSel} />
              </div>
            </div>
          </div>
        ))}
      </section>

      {overdue.length > 0 && !selMode && (
        <section style={S.panel}>
          <div style={S.panelHead}><span style={{ ...S.panelDot, background: "#DC2626" }} /><h2 style={S.panelTitle}>Overdue</h2><span style={S.panelCount}>{overdue.length}</span></div>
          {overdue.map((t) => <TaskRow key={t.id} task={t} onOpen={onOpen} onComplete={onComplete} onReschedule={onReschedule} onEmail={onEmail} overdue />)}
        </section>
      )}

      {selMode && selected.length > 0 && (
        <div style={S.bulkBar}>
          <span style={S.bulkCount}>{selected.length} selected</span>
          <button style={S.bulkBtn} className="helm-mini" onClick={() => { onBulkComplete(selected); clearSel(); }}>Complete</button>
          <button style={S.bulkBtn} className="helm-mini" onClick={() => { onBulkReschedule(selected, toISO(addDays(today(), 1))); clearSel(); }}>Tomorrow</button>
          <button style={S.bulkBtn} className="helm-mini" onClick={() => { onBulkReschedule(selected, toISO(addDays(today(), 7))); clearSel(); }}>Next week</button>
          {!picking ? <button style={S.bulkBtn} className="helm-mini" onClick={() => setPicking(true)}>Pick date…</button>
            : <input type="date" autoFocus style={{ ...S.input, width: 150 }} className="helm-input" onChange={(e) => { if (e.target.value) { onBulkReschedule(selected, e.target.value); clearSel(); } }} />}
          <button style={S.bulkDelete} className="helm-delete" onClick={() => { onBulkDelete(selected); clearSel(); }}>Delete</button>
        </div>
      )}
    </div>
  );
}

function EmailModal({ task, onClose, onNotice }) {
  const compose = () => {
    const L = [];
    if (task.notes) { L.push(task.notes, ""); }
    if (task.dueDate) L.push(`Due: ${fmtLong(task.dueDate)}`);
    if (task.stores && task.stores.length) L.push(`Stores: ${task.stores.join(", ")}`);
    if (task.subtasks && task.subtasks.length) { L.push("", "Checklist:"); task.subtasks.forEach((sx) => L.push(`- [${sx.done ? "x" : " "}] ${sx.text}`)); }
    return L.join("\n").trim();
  };
  const [subject, setSubject] = useState(task.title);
  const [body, setBody] = useState(compose());
  const [busy, setBusy] = useState(false);
  const copy = async () => { try { await navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`); onNotice({ type: "success", text: "Email copied to clipboard." }); } catch (e) { onNotice({ type: "block", text: "Couldn't copy — select the text and copy manually." }); } };
  const polish = async () => { setBusy(true); try { const out = await aiText(`Rewrite the following into a brief, professional email body, concise and ready to send. No subject line, no placeholders like [Name]. Task title: "${task.title}". Draft:\n${body}`); if (out) setBody(out); } catch (e) { onNotice({ type: "block", text: "Couldn't reach the writing assistant just now." }); } setBusy(false); };
  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={{ ...S.modal, width: 520, maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()} className="helm-scroll">
        <h2 style={S.modalTitle}>Draft an email</h2>
        <div style={S.modalSub}>Prefilled from this task. Edit it, then copy it into a new email.</div>
        <label style={S.fieldLabel}>Subject</label>
        <input value={subject} onChange={(e) => setSubject(e.target.value)} style={S.input} className="helm-input" />
        <label style={S.fieldLabel}>Body</label>
        <textarea value={body} onChange={(e) => setBody(e.target.value)} style={{ ...S.textarea, minHeight: 170 }} className="helm-input" />
        <button onClick={polish} disabled={busy} style={{ ...S.sparkleBtn, marginTop: 8 }} className="helm-mini">{busy ? "Polishing…" : "✦ Polish with AI"}</button>
        <div style={S.modalBtns}>
          <button onClick={onClose} style={S.btnGhost}>Close</button>
          <button onClick={copy} style={S.btnPrimary} className="helm-primary">Copy email</button>
        </div>
      </div>
    </div>
  );
}

function BriefModal({ dueToday, overdue, thisWeek, onClose, onNotice }) {
  const build = () => {
    const L = [];
    L.push(`Morning brief — ${fmtLong(toISO(today()))}`, "");
    if (overdue.length) { L.push(`OVERDUE (${overdue.length}):`); overdue.forEach((t) => L.push(`- ${t.title} [${t.subArea || t.area}]${t.stores.length ? " (" + t.stores.join(", ") + ")" : ""} — ${relDay(t.dueDate)}`)); L.push(""); }
    L.push(`DUE TODAY (${dueToday.length}):`);
    if (dueToday.length === 0) L.push("- (nothing scheduled)"); else dueToday.forEach((t) => L.push(`- ${t.title} [${t.subArea || t.area}]${t.stores.length ? " (" + t.stores.join(", ") + ")" : ""}`));
    L.push("", `Coming up this week: ${thisWeek.length} more.`);
    return L.join("\n");
  };
  const text = build();
  const copy = async () => { try { await navigator.clipboard.writeText(text); onNotice({ type: "success", text: "Morning brief copied — paste it anywhere." }); onClose(); } catch (e) { onNotice({ type: "block", text: "Couldn't copy — select the text manually." }); } };
  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={{ ...S.modal, width: 520 }} onClick={(e) => e.stopPropagation()}>
        <h2 style={S.modalTitle}>Morning brief</h2>
        <div style={S.modalSub}>Today's overdue and due items, ready to paste into an email or hand to a manager.</div>
        <textarea readOnly value={text} style={{ ...S.textarea, minHeight: 230, fontFamily: "ui-monospace, monospace", fontSize: 12.5 }} className="helm-input" />
        <div style={S.modalBtns}>
          <button onClick={onClose} style={S.btnGhost}>Close</button>
          <button onClick={copy} style={S.btnPrimary} className="helm-primary">Copy brief</button>
        </div>
      </div>
    </div>
  );
}

function WhatsNewModal({ onClose }) {
  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={{ ...S.modal, width: 460 }} onClick={(e) => e.stopPropagation()}>
        <h2 style={S.modalTitle}>What's new</h2>
        <div style={S.modalSub}>Helm v{VERSION}</div>
        <div style={{ maxHeight: 360, overflowY: "auto", marginTop: 6 }} className="helm-scroll">

              <ul style={{ margin: 0, paddingLeft: 18 }}>{c.items.map((it, i) => <li key={i} style={{ fontSize: 13.5, color: "#3A424E", marginBottom: 4, lineHeight: 1.4 }}>{it}</li>)}</ul>

function RecapModal({ text, onClose }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => { try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {} };
  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={{ ...S.modal, width: 560 }} onClick={(e) => e.stopPropagation()}>
        <h2 style={S.modalTitle}>Weekly recap</h2>
        <div style={S.modalSub}>Everything you closed in the last 7 days, grouped by area — ready to paste into an email or status update.</div>
        <textarea readOnly value={text} style={{ ...S.textarea, minHeight: 260, fontFamily: "ui-monospace, monospace", fontSize: 12.5 }} className="helm-input" />
        <div style={S.modalBtns}>
          <button onClick={onClose} style={S.btnGhost}>Close</button>
          <button onClick={copy} style={S.btnPrimary} className="helm-primary">{copied ? "Copied ✓" : "Copy recap"}</button>
        </div>
      </div>
    </div>
  );
}

function RowSnooze({ task, onReschedule }) {
  const [open, setOpen] = useState(false);
  const [picking, setPicking] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setPicking(false); } };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [open]);
  const pick = (iso) => { onReschedule(task.id, iso); setOpen(false); setPicking(false); };
  return (
    <div ref={ref} style={{ position: "relative", flexShrink: 0 }}>
      <button onClick={(e) => { e.stopPropagation(); setOpen((o) => !o); }} className="helm-snooze" style={{ ...S.snoozeBtn, ...(open ? { opacity: 1, background: "#EEF0F4" } : {}) }} title="Snooze / reschedule">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l2.5 1.5" /><path d="M5 3 2 6" /><path d="M19 3l3 3" /></svg>
      </button>
      {open && (
        <div style={S.snoozeMenu} onClick={(e) => e.stopPropagation()}>
          <div style={S.snoozeHead}>Move to</div>
          <button style={S.snoozeItem} className="helm-nav" onClick={() => pick(toISO(addDays(today(), 1)))}>Tomorrow</button>
          <button style={S.snoozeItem} className="helm-nav" onClick={() => pick(toISO(addDays(today(), 7)))}>In a week</button>
          <button style={S.snoozeItem} className="helm-nav" onClick={() => pick(toISO(nextWeekday(addDays(today(), 1), 1)))}>Next Monday</button>
          <button style={S.snoozeItem} className="helm-nav" onClick={() => pick(toISO(addMonths(today(), 1)))}>In a month</button>
          {!picking ? <button style={S.snoozeItem} className="helm-nav" onClick={() => setPicking(true)}>Pick a date…</button>
            : <input type="date" autoFocus style={{ ...S.input, marginTop: 4 }} className="helm-input" onChange={(e) => e.target.value && pick(e.target.value)} />}
        </div>
      )}
    </div>
  );
}

function SearchView({ query, tasks, onOpen, onComplete, onReschedule, onEmail }) {
  const [status, setStatus] = useState("open");
  const q = query.trim().toLowerCase();
  const match = (t) => [t.title, t.notes, t.area, t.subArea, (t.stores || []).join(" "), t.subtasks.map((sx) => sx.text).join(" ")].join(" ").toLowerCase().includes(q);
  const results = tasks.filter(match).filter((t) => status === "all" ? true : status === "open" ? !t.completed : t.completed).sort((a, b) => ((a.dueDate) || "9").localeCompare((b.dueDate) || "9"));
  return (
    <div className="helm-scroll" style={S.scroll}>
      <header style={S.head}>
        <h1 style={S.h1}>Search</h1>
        <div style={S.subhead}>{results.length} {results.length === 1 ? "match" : "matches"} for &ldquo;{query}&rdquo; — across every area and date.</div>
        <div style={{ display: "flex", gap: 6, marginTop: 12 }}>
          {[["open", "Open"], ["completed", "Completed"], ["all", "All"]].map(([k, label]) => (
            <button key={k} onClick={() => setStatus(k)} style={{ ...S.filterChip, ...(status === k ? S.filterChipOn : {}) }}>{label}</button>
          ))}
        </div>
      </header>
      {results.length === 0 ? <Empty text="Nothing matches. Try fewer or different words." /> : (
        <div style={{ maxWidth: 760 }}>
          {results.map((t) => {
            const a = AREAS[t.area]; const date = t.dueDate;
            return (
              <div key={t.id} className="helm-rowhover" style={S.searchRow}>
                <button onClick={(e) => { e.stopPropagation(); onComplete(t.id); }} style={{ ...S.check, borderColor: a.color }} className="helm-check" title="Complete">{t.recurrence ? <span style={{ ...S.recurDot, background: a.color }} /> : null}</button>
                <div style={{ flex: 1, cursor: "pointer" }} onClick={() => onOpen(t.id)}>
                  <div style={S.rowTitle}>{t.title} {t.completed && <span style={S.doneFlag}>done</span>}</div>
                  <div style={S.rowMeta}>
                    <span style={{ ...S.areaTag, color: a.color, background: a.soft }}>{t.subArea || t.area}</span>
                    {date && <span style={{ ...S.metaDim, ...(date && !t.completed && fromISO(date) < today() ? { color: "#DC2626", fontWeight: 700 } : {}) }}>{relDay(date)}</span>}
                    {t.recurrence && <span style={S.metaDim}>↻ {recurLabel(t.recurrence)}</span>}
                    {(t.stores || []).map((sx) => <span key={sx} style={S.storeTag}>{sx}</span>)}
                  </div>
                </div>
                {!t.completed && (
                  <div style={S.rowActions}>
                    {onEmail && <button className="helm-snooze" style={S.snoozeBtn} title="Draft an email from this task" onClick={(e) => { e.stopPropagation(); onEmail(t); }}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg></button>}
                    {onReschedule && <RowSnooze task={t} onReschedule={onReschedule} />}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TriageModal({ items, onDone, onReschedule, onDrop, onClose }) {
  const [i, setI] = useState(0);
  const [picking, setPicking] = useState(false);
  const [confirmAll, setConfirmAll] = useState(false);
  const [skipRecurring, setSkipRecurring] = useState(true);
  const targets = skipRecurring ? items.filter((it) => !it.recurrence) : items;
  const recurringCount = items.filter((it) => it.recurrence).length;
  const batchReschedule = (days) => { const iso = toISO(addDays(today(), days)); targets.forEach((it) => onReschedule(it.id, iso)); onClose(); };
  const batchComplete = () => { if (!confirmAll) { setConfirmAll(true); return; } targets.forEach((it) => onDone(it.id)); onClose(); };
  if (!items || items.length === 0) return null;
  const t = items[i];
  const advance = () => { setPicking(false); if (i + 1 >= items.length) onClose(); else setI(i + 1); };
  const act = (fn) => { fn(); advance(); };
  const a = AREAS[t.area];
  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={S.modal} onClick={(e) => e.stopPropagation()}>
        <div style={S.triageBatch}>
          <span style={S.triageBatchLabel}>Batch {targets.length}:</span>
          <button style={S.triageBatchBtn} className="helm-mini" onClick={() => batchReschedule(0)}>→ Today</button>
          <button style={S.triageBatchBtn} className="helm-mini" onClick={() => batchReschedule(7)}>→ Next week</button>
          <button style={{ ...S.triageBatchBtn, ...(confirmAll ? { background: "#DC2626", color: "#fff", borderColor: "#DC2626" } : {}) }} className="helm-mini" onClick={batchComplete}>{confirmAll ? `Confirm — complete ${targets.length}` : "Mark all done"}</button>
          <label style={S.triageSkip}><input type="checkbox" checked={skipRecurring} onChange={(e) => { setSkipRecurring(e.target.checked); setConfirmAll(false); }} style={{ marginRight: 5 }} />Skip recurring{recurringCount > 0 ? ` (${recurringCount} kept)` : ""}</label>
        </div>
        <div style={S.triageProgress}>Or one at a time · {i + 1} of {items.length}</div>
        <h2 style={S.modalTitle}>{t.title}</h2>
        <div style={S.modalSub}><span style={{ ...S.areaTag, color: a.color, background: a.soft }}>{t.subArea || t.area}</span> {t.dueDate ? ` · due ${relDay(t.dueDate)}` : ""}{(t.stores || []).length ? ` · ${t.stores.join(", ")}` : ""}</div>
        <div style={S.triageBtns}>
          <button style={S.triageDo} className="helm-primary" onClick={() => act(() => onDone(t.id))}>Did it</button>
          <button style={S.triageBtn} className="helm-mini" onClick={() => act(() => onReschedule(t.id, toISO(addDays(today(), 1))))}>Tomorrow</button>
          <button style={S.triageBtn} className="helm-mini" onClick={() => act(() => onReschedule(t.id, toISO(addDays(today(), 7))))}>Next week</button>
          {!picking ? <button style={S.triageBtn} className="helm-mini" onClick={() => setPicking(true)}>Pick date…</button>
            : <input type="date" autoFocus style={{ ...S.input, width: 160 }} className="helm-input" onChange={(e) => e.target.value && act(() => onReschedule(t.id, e.target.value))} />}
          <button style={S.triageDrop} className="helm-delete" onClick={() => act(() => onDrop(t.id))}>Delete</button>
        </div>
        <div style={S.modalBtns}><button onClick={advance} style={S.btnGhost}>Skip for now</button><button onClick={onClose} style={S.btnGhost}>Done</button></div>
      </div>
    </div>
  );
}


function TableStoresCell({ task, onUpdate }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => { if (!open) return; const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h); }, [open]);
  const toggle = (sx) => onUpdate(task.id, { stores: task.stores.includes(sx) ? task.stores.filter((x) => x !== sx) : [...task.stores, sx] });
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button onClick={() => setOpen((o) => !o)} style={S.cellBtn} className="helm-cell">{task.stores.length ? task.stores.join(", ") : <span style={{ color: "#B4BAC3" }}>—</span>}</button>
      {open && <div style={S.cellPop} onClick={(e) => e.stopPropagation()}>{STORES.map((sx) => <button key={sx} onClick={() => toggle(sx)} style={{ ...S.storeChip, ...(task.stores.includes(sx) ? S.storeChipOn : {}), margin: 2 }}>{sx}</button>)}</div>}
    </div>
  );
}

function TableRepeatCell({ task, onUpdate }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => { if (!open) return; const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h); }, [open]);
  const r = task.recurrence;
  const setFreq = (f) => { if (!f) return onUpdate(task.id, { recurrence: null }); const rec = { frequency: f, weekday: f === "weekly" ? (r?.weekday ?? today().getDay()) : null, behavior: r?.behavior || "must", anchor: (f === "monthly" || f === "quarterly") ? (r?.anchor || "date") : undefined, interval: r?.interval || 1, until: r?.until || null }; onUpdate(task.id, { recurrence: rec, dueDate: task.dueDate || toISO(today()) }); };
  const patchRec = (p) => onUpdate(task.id, { recurrence: { ...r, ...p } });
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button onClick={() => setOpen((o) => !o)} style={S.cellBtn} className="helm-cell">{r ? recurLabel(r) : <span style={{ color: "#B4BAC3" }}>—</span>}</button>
      {open && (
        <div style={{ ...S.cellPop, width: 234 }} onClick={(e) => e.stopPropagation()}>
          <select value={r ? r.frequency : ""} onChange={(e) => setFreq(e.target.value)} style={S.input} className="helm-input"><option value="">Does not repeat</option>{FREQS.map((fr) => <option key={fr} value={fr}>{fr[0].toUpperCase() + fr.slice(1)}</option>)}</select>
          {r && <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6 }}><span style={{ fontSize: 12.5, color: "#5B6472" }}>Every</span><input type="number" min="1" value={r.interval || 1} onChange={(e) => patchRec({ interval: Math.max(1, parseInt(e.target.value, 10) || 1) })} style={{ ...S.input, width: 66 }} className="helm-input" /><span style={{ fontSize: 12.5, color: "#5B6472" }}>{unitLabel(r)}</span></div>}
          {r?.frequency === "daily" && <button onClick={() => patchRec({ weekdaysOnly: !r.weekdaysOnly })} style={{ marginTop: 6, width: "100%", border: "1px solid " + (r.weekdaysOnly ? "#14181F" : "#E0E3E9"), background: r.weekdaysOnly ? "#14181F" : "#fff", color: r.weekdaysOnly ? "#fff" : "#3A424E", borderRadius: 8, padding: "6px 10px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: FONT }}>{r.weekdaysOnly ? "✓ " : ""}Weekdays only</button>}
          {r?.frequency === "weekly" && <select value={r.weekday ?? 1} onChange={(e) => patchRec({ weekday: parseInt(e.target.value, 10) })} style={{ ...S.input, marginTop: 6 }} className="helm-input">{WEEKDAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select>}
          {(r?.frequency === "monthly" || r?.frequency === "quarterly") && <select value={r.anchor || "date"} onChange={(e) => { const anchor = e.target.value; if (anchor === "fbd") onUpdate(task.id, { recurrence: { ...r, anchor }, dueDate: toISO(nextFirstBusinessDay(today())) }); else if (anchor === "lbd") onUpdate(task.id, { recurrence: { ...r, anchor }, dueDate: toISO(nextLastBusinessDay(today())) }); else patchRec({ anchor }); }} style={{ ...S.input, marginTop: 6 }} className="helm-input"><option value="date">{r.frequency === "monthly" ? "Same day each month" : "Same day each quarter"}</option><option value="fbd">First business day</option><option value="lbd">Last business day</option></select>}
        </div>
      )}
    </div>
  );
}

function TableView({ tasks, onOpen, onComplete, onUpdate }) {
  const [sortKey, setSortKey] = useState("due");
  const [sortDir, setSortDir] = useState("asc");
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("open");
  const [repeatOnly, setRepeatOnly] = useState(false);
  const [noDateOnly, setNoDateOnly] = useState(false);
  const ql = q.trim().toLowerCase();
  const base = tasks.filter((t) => (status === "all" ? true : status === "completed" ? t.completed : !t.completed) && (!repeatOnly || !!t.recurrence) && (!noDateOnly || !t.dueDate));
  const filtered = ql ? base.filter((t) => [t.title, t.area, t.subArea || "", t.stores.join(" "), t.notes || "", t.recurrence ? recurLabel(t.recurrence) : "", (t.subtasks || []).map((sx) => sx.text).join(" ")].join(" ").toLowerCase().includes(ql)) : base;
  const cols = [["title", "Task"], ["area", "Area"], ["sub", "Sub-area"], ["due", "Due"], ["stores", "Stores"], ["repeat", "Repeat"], ["next", "Next"]];
  const toggleSort = (k) => { if (sortKey === k) setSortDir((d) => (d === "asc" ? "desc" : "asc")); else { setSortKey(k); setSortDir("asc"); } };
  const getVal = (t, k) => k === "title" ? t.title.toLowerCase() : k === "area" ? t.area.toLowerCase() : k === "sub" ? (t.subArea || "").toLowerCase() : k === "due" ? (t.dueDate || "9999-99-99") : k === "stores" ? (t.stores.join(",").toLowerCase() || "zzzz") : k === "next" ? (t.recurrence && t.dueDate ? (forecastOccurrences(t, 1)[0] || "9999-99-99") : "9999-99-99") : (t.recurrence ? recurLabel(t.recurrence).toLowerCase() : "zzzz");
  const sorted = [...filtered].sort((a, b) => { const va = getVal(a, sortKey), vb = getVal(b, sortKey); const cmp = va < vb ? -1 : va > vb ? 1 : 0; return sortDir === "asc" ? cmp : -cmp; });
  return (
    <div className="helm-scroll" style={S.scroll}>
      <header style={S.head}>
        <h1 style={S.h1}>Table</h1>
        <div style={S.subhead}>Edit Area, Sub-area, due date, stores, and repeat right in the grid. Click a title to open the full task.</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search this table — title, notes, area, stores…" style={{ ...S.input, maxWidth: 420 }} className="helm-input" />
          {ql && <span style={{ fontSize: 13, color: "#9AA1AC" }}>{sorted.length} match{sorted.length === 1 ? "" : "es"}</span>}
          {ql && <button onClick={() => setQ("")} style={S.dataBtn} className="helm-mini">Clear</button>}
          <div style={{ display: "flex", gap: 6, marginLeft: "auto", flexWrap: "wrap" }}>
            {[["open", "Open"], ["completed", "Completed"], ["all", "All"]].map(([k, label]) => (
              <button key={k} onClick={() => setStatus(k)} style={{ ...S.filterChip, ...(status === k ? S.filterChipOn : {}) }}>{label}</button>
            ))}
            <button onClick={() => setRepeatOnly((v) => !v)} style={{ ...S.filterChip, ...(repeatOnly ? S.filterChipOn : {}) }} title="Only repeating tasks">↻ Repeats</button>
            <button onClick={() => setNoDateOnly((v) => !v)} style={{ ...S.filterChip, ...(noDateOnly ? S.filterChipOn : {}) }} title="Only tasks with no due date">No date</button>
          </div>
        </div>
      </header>
      {sorted.length === 0 ? <Empty text={ql ? "No tasks match your search." : status === "completed" ? "No completed tasks in range." : status === "all" ? "No tasks to show." : "No open tasks to show."} /> : (
        <div style={S.tableWrap} className="helm-scroll">
          <table style={S.table}>
            <thead><tr>
              <th style={{ ...S.th, width: 34 }}></th>
              {cols.map(([k, label]) => (
                <th key={k} style={{ ...S.th, cursor: "pointer" }} className="helm-th" onClick={() => toggleSort(k)}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>{label}<span style={{ color: sortKey === k ? "#14181F" : "#CDD2DA", fontSize: 9 }}>{sortKey === k ? (sortDir === "asc" ? "▲" : "▼") : "▲"}</span></span>
                </th>
              ))}
            </tr></thead>
            <tbody>
              {sorted.map((t) => {
                const a = AREAS[t.area];
                return (
                  <tr key={t.id}>
                    <td style={S.td}><button onClick={() => onComplete(t.id)} style={{ ...S.check, borderColor: a.color, ...(t.completed ? { background: a.color, color: "#fff" } : {}) }} className="helm-check" title={t.completed ? "Reopen" : "Complete"}>{t.completed ? "✓" : (t.recurrence ? <span style={{ ...S.recurDot, background: a.color }} /> : null)}</button></td>
                    <td style={S.td}><span style={{ ...S.tblTitle, ...(t.completed ? { textDecoration: "line-through", color: "#9AA1AC" } : {}) }} onClick={() => onOpen(t.id)}>{t.title}</span></td>
                    <td style={S.td}><select value={t.area} onChange={(e) => onUpdate(t.id, { area: e.target.value, subArea: null })} style={S.tblField} className="helm-input helm-cell">{AREA_NAMES.map((x) => <option key={x}>{x}</option>)}</select></td>
                    <td style={S.td}><select value={t.subArea || ""} onChange={(e) => onUpdate(t.id, { subArea: e.target.value || null })} style={S.tblField} className="helm-input helm-cell"><option value="">—</option>{[...a.subs].sort((p, q) => p.localeCompare(q)).map((x) => <option key={x}>{x}</option>)}</select></td>
                    <td style={S.td}><input type="date" value={t.dueDate || ""} onChange={(e) => onUpdate(t.id, { dueDate: e.target.value || null })} style={{ ...S.tblField, minWidth: 132 }} className="helm-input helm-cell" /></td>
                    <td style={S.td}><TableStoresCell task={t} onUpdate={onUpdate} /></td>
                    <td style={S.td}><TableRepeatCell task={t} onUpdate={onUpdate} /></td>
                    <td style={S.td}>{t.recurrence && t.dueDate ? (() => { const nx = forecastOccurrences(t, 1)[0]; return nx ? <span style={S.tblNext}>{fmtSeq(nx)}</span> : <span style={S.tblDash}>—</span>; })() : <span style={S.tblDash}>—</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function ConfirmModal({ data, onClose }) {

    <div style={S.overlay} onClick={onClose}>
      <div style={S.modal} onClick={(e) => e.stopPropagation()}>

    </div>
  );
}

      .helm-rowhover { transition: background .12s ease; border-radius: 8px; }
      .helm-rowhover:hover { background: #F4F5F8; }

const _loginInput = { width: "100%", boxSizing: "border-box", border: "1px solid #E0E3E9", borderRadius: 9, padding: "10px 12px", fontSize: 14, fontFamily: "Inter, sans-serif" };
const _loginBtn = { width: "100%", marginTop: 14, border: "none", background: "#14181F", color: "#fff", borderRadius: 9, padding: "11px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "Inter, sans-serif" };

function Root() {
  const [session, setSession] = useState(undefined);
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div style={{ padding: 40, fontFamily: "Inter, sans-serif", color: "#5B6472" }}>Loading…</div>;
  if (!session) {
    const signIn = async () => {
      setBusy(true); setErr("");
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
      if (error) setErr(error.message);
      setBusy(false);
    };
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, sans-serif", background: "#F4F5F8" }}>
        <div style={{ width: 320, background: "#fff", border: "1px solid #E6E9EE", borderRadius: 14, padding: 26, boxShadow: "0 8px 30px rgba(20,24,31,.08)" }}>
          <div style={{ fontFamily: "'Bricolage Grotesque', Inter, sans-serif", fontSize: 24, fontWeight: 700, color: "#14181F", marginBottom: 4 }}>Helm</div>
          <div style={{ fontSize: 13, color: "#8A92A0", marginBottom: 18 }}>Sign in to continue</div>
          <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" style={_loginInput} />
          <input value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && signIn()} type="password" placeholder="Password" style={{ ..._loginInput, marginTop: 8 }} />
          {err && <div style={{ color: "#DC2626", fontSize: 12.5, marginTop: 8 }}>{err}</div>}
          <button onClick={signIn} disabled={busy} style={_loginBtn}>{busy ? "Signing in…" : "Sign in"}</button>
        </div>
      </div>
    );
  }
  return <Helm />;
}
window.helmSignOut = () => sb.auth.signOut();
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
<script>
  (function () {
    try {
      var src = document.getElementById("helm-src").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], sourceType: "script" }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<pre style="padding:24px;color:#b00020;white-space:pre-wrap;font:13px ui-monospace,monospace">Helm failed to start:\n\n' +
        ((e && e.message) ? e.message : String(e)) + '</pre>';
      console.error(e);
    }
  })();
</script>
